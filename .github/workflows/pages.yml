# 只在手动触发时运行：仓库默认用「Deploy from a branch」发布（见 README）。
# 想改成 Actions 发布：Settings → Pages → Source 选 GitHub Actions，然后在这个
# workflow 上点 Run workflow 一次；之后每次 push 都会自动发布。
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
