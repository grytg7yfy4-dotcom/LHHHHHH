<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#0f172a; --sub:#475569; --muted:#94a3b8;
    --line:#e5eaf3; --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.06);
  }
  html[data-theme=dark]{
    --bg:#0b1220; --panel:#111a2b; --ink:#e8eefc; --sub:#b6c2d9; --muted:#7f8da5;
    --line:#1e2a40; --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ---------- 顶栏 ---------- */
  header.top{height:60px;display:flex;align-items:center;gap:18px;padding:0 18px;
    background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
  .brand{display:flex;align-items:baseline;gap:9px;font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
  .brand small{font-weight:400;font-size:11.5px;color:var(--muted)}
  .search{flex:1;max-width:540px;position:relative}
  .search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
    color:var(--ink);padding:0 76px 0 36px;font-size:13px;outline:none}
  .search input:focus{border-color:#93b4f7;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .search .ico{position:absolute;left:12px;top:9px;color:var(--muted);font-size:14px}
  .search kbd{position:absolute;right:10px;top:9px;font-size:11px;color:var(--muted);
    border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--panel)}
  .search .hit{position:absolute;right:44px;top:10px;font-size:11px;color:#2563eb}
  .actions{display:flex;align-items:center;gap:6px;margin-left:auto}
  .actions button{height:34px;min-width:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;
    padding:0 10px;font-size:12.5px;color:var(--sub)}
  .actions button:hover{border-color:#93b4f7;color:#2563eb}
  #zoomLabel{font-size:12px;color:var(--muted);width:42px;text-align:center;font-variant-numeric:tabular-nums}

  /* ---------- 布局 ---------- */
  .app{display:grid;grid-template-columns:252px 1fr;height:calc(100vh - 60px)}
  aside.nav{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px 28px}
  .grp{font-size:11px;color:var(--muted);letter-spacing:.6px;margin:14px 8px 6px}
  .grp:first-child{margin-top:2px}
  .navitem{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;
    padding:8px 9px;border-radius:9px;text-align:left;color:var(--sub);font-size:12.5px;line-height:1.3}
  .navitem:hover{background:rgba(37,99,235,.07);color:var(--ink)}
  .navitem.on{background:rgba(37,99,235,.12);color:#2563eb;font-weight:700}
  .navitem .no{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);min-width:18px}
  .navitem.on .no{color:#2563eb}

  /* ---------- 画布 ---------- */
  main.mapwrap{position:relative;overflow:hidden;cursor:grab;
    background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);background-size:22px 22px}
  main.mapwrap.drag{cursor:grabbing}
  .stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .tree{display:flex;align-items:center;gap:58px;padding:46px 56px;position:relative}
  .groups{display:flex;flex-direction:column;gap:26px}
  .bg-group{display:flex;align-items:center;gap:34px}
  .leaves{display:flex;flex-direction:column;gap:11px}

  .node.root{width:212px;border-radius:16px;background:#0f172a;color:#fff;padding:18px 18px 16px;
    box-shadow:0 18px 40px rgba(15,23,42,.28);position:relative;z-index:2}
  .node.root .kicker{font-size:10.5px;color:#94a3b8;letter-spacing:1px}
  .node.root .rtitle{font-size:19px;font-weight:800;line-height:1.35;margin:7px 0 8px}
  .node.root .rmeta{font-size:10.5px;color:#cbd5e1}
  .node.root .accentbar{height:4px;width:46px;border-radius:2px;margin-top:12px;background:var(--accent,#2563eb)}

  .branch{position:relative;z-index:2;min-width:158px;max-width:158px;border:0;border-radius:11px;
    background:var(--accent,#2563eb);color:#fff;padding:11px 14px;font-size:13.5px;font-weight:700;
    line-height:1.35;text-align:left;box-shadow:0 8px 18px rgba(15,23,42,.12);
    display:flex;align-items:center;gap:8px;transition:filter .15s,transform .15s}
  .branch:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .branch .n{margin-left:auto;font-size:10.5px;font-weight:600;opacity:.8;background:rgba(255,255,255,.18);
    border-radius:6px;padding:1px 6px}
  .branch.collapsed{opacity:.55;filter:saturate(.6)}

  /* 知识点卡片：整卡可点，点开看细节 */
  .leaf{position:relative;z-index:2;width:472px;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--accent,#2563eb);border-radius:10px;padding:10px 14px 10px 15px;
    box-shadow:var(--shadow);cursor:pointer;
    transition:box-shadow .15s,border-color .15s,opacity .2s,transform .12s}
  .leaf:hover{border-color:var(--accent,#2563eb);box-shadow:0 8px 26px rgba(15,23,42,.10)}
  .leaf:active{transform:scale(.997)}
  .leaf.dim{opacity:.22}
  .lhead{display:flex;align-items:center;gap:10px;user-select:none}
  .leaf h4{margin:0;font-size:13.5px;font-weight:700;color:var(--accent,#2563eb);line-height:1.5;flex:1}
  .leaf .chev{font-size:11px;color:var(--muted);transition:transform .18s;flex:0 0 auto}
  .leaf.open .chev{transform:rotate(180deg)}
  .hintline{font-size:10.5px;color:var(--muted);margin:3px 0 0 0;user-select:none}
  .leaf.open .hintline{display:none}
  .leaf ul{display:none;margin:10px 0 2px;padding:0 0 0 2px;list-style:none}
  .leaf.open ul{display:block}
  .leaf li{position:relative;padding-left:15px;margin:5px 0;font-size:12.8px;line-height:1.7;color:var(--sub)}
  .leaf li::before{content:"";position:absolute;left:2px;top:10px;width:4px;height:4px;border-radius:50%;
    background:var(--accent,#2563eb);opacity:.65}

  svg.links{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible}
  svg.links path{fill:none;stroke:var(--accent,#2563eb);stroke-opacity:.38;stroke-width:1.7}

  .hint{position:absolute;left:18px;bottom:14px;font-size:11.5px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);
    padding:6px 10px;border-radius:8px;pointer-events:none;box-shadow:var(--shadow)}
  .chbar{position:absolute;right:16px;top:14px;display:flex;gap:8px;z-index:3}
  .chbar a{font-size:11.5px;color:var(--sub);text-decoration:none;border:1px solid var(--line);
    background:var(--panel);padding:7px 10px;border-radius:9px}
  .chbar a:hover{color:#2563eb;border-color:#93b4f7}

  @media (max-width:860px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    aside.nav{display:flex;gap:6px;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
    aside.nav .grp{display:none}
    .navitem{white-space:nowrap}
    .search{max-width:none}
    .brand small{display:none}
    .leaf{width:min(80vw,472px)}
  }
</style>
</head>

const $ = s => document.querySelector(s);
const stage = $('#stage'), mapwrap = $('#mapwrap'), nav = $('#nav');

const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

const state = {
  idx: 0,
  scale: 1, tx: 0, ty: 0,
  open: store.get('ml.open.v2', {}),            // {chId: [leafIdx...]}
  collapsed: store.get('ml.collapsed.v1', {})   // {chId: [branchIdx...]}
};
const chOf = i => DATA.chapters[i];
const chId = i => chOf(i).id;
const isOpen = (ci, li) => (state.open[chId(ci)] || []).includes(li);
const isCollapsed = (ci, bi) => (state.collapsed[chId(ci)] || []).includes(bi);

function toggleIn(obj, key, val){
  const arr = obj[key] || (obj[key] = []);
  const i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1); else arr.push(val);
}

/* ---------------- 导航 ---------------- */
function buildNav(){
  nav.innerHTML = '';
  let lastCourse = null;
  DATA.chapters.forEach((ch, i) => {
    if (ch.course !== lastCourse){
      const g = document.createElement('div');
      g.className = 'grp';
      g.textContent = ch.courseName;
      nav.appendChild(g);
      lastCourse = ch.course;
    }
    const b = document.createElement('button');
    b.className = 'navitem' + (i === state.idx ? ' on' : '');
    b.dataset.i = i;
    b.innerHTML = `<span class="no">${ch.id}</span><span>${ch.title}</span>`;
    b.onclick = () => go(i);
    nav.appendChild(b);
  });
}

function refreshNav(){
  [...nav.querySelectorAll('.navitem')].forEach(b => b.classList.toggle('on', +b.dataset.i === state.idx));
}

/* ---------------- 绘制 ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderChapter(){
  const ch = chOf(state.idx);
  document.documentElement.style.setProperty('--accent', ch.accent);
  $('#rawLink').href = 'docs/' + ch.file;
  stage.innerHTML = '';

  const tree = document.createElement('div');
  tree.className = 'tree';
  tree.style.setProperty('--accent', ch.accent);

  const root = document.createElement('div');
  root.className = 'node root';
  root.innerHTML = `<div class="kicker">第 ${ch.id} 章 · 共 12 章</div>
    <div class="rtitle">${esc(ch.title)}</div>
    <div class="rmeta">${ch.parts} · ${ch.n} 集 · ${ch.minutes} min</div>
    <div class="accentbar"></div>`;
  tree.appendChild(root);

  const groups = document.createElement('div');
  groups.className = 'groups';

  ch.branches.forEach((br, bi) => {
    const g = document.createElement('div');
    g.className = 'bg-group';

    const btn = document.createElement('button');
    btn.className = 'branch' + (isCollapsed(state.idx, bi) ? ' collapsed' : '');
    btn.dataset.b = bi;
    btn.innerHTML = `<span>${esc(br.name)}</span><span class="n">${br.leaves.length}</span>`;
    btn.onclick = () => {
      toggleIn(state.collapsed, chId(state.idx), bi);
      store.set('ml.collapsed.v1', state.collapsed);
      renderChapter();
    };
    g.appendChild(btn);

    const leaves = document.createElement('div');
    leaves.className = 'leaves';
    if (isCollapsed(state.idx, bi)) leaves.style.display = 'none';

    br.leaves.forEach((lf, li) => {
      const gi = brOffset(state.idx, bi) + li;
      const art = document.createElement('article');
      art.className = 'leaf' + (isOpen(state.idx, gi) ? ' open' : '');
      art.dataset.i = gi;
      art.title = '点击展开 / 收起';
      art.innerHTML = `
        <div class="lhead">
          <h4>${esc(lf.head)}</h4>
          <span class="chev">⌄</span>
        </div>
        <div class="hintline">${lf.bullets.length} 条要点 · 点击展开</div>
        <ul>${lf.bullets.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
      art.onclick = () => {
        toggleIn(state.open, chId(state.idx), gi);
        store.set('ml.open.v2', state.open);
        art.classList.toggle('open', isOpen(state.idx, gi));
        requestAnimationFrame(drawLinks);
      };
      leaves.appendChild(art);
    });

    g.appendChild(leaves);
    groups.appendChild(g);
  });

  tree.appendChild(groups);
  stage.appendChild(tree);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'links');
  stage.appendChild(svg);

  requestAnimationFrame(() => { drawLinks(); if (!state._fitted) { fit(); state._fitted = true; } });
}

const _offsets = {};
function brOffset(ci, bi){
  const key = chId(ci) + ':' + bi;
  if (_offsets[key] != null) return _offsets[key];
  const ch = chOf(ci);
  let n = 0;
  for (let k = 0; k < bi; k++) n += ch.branches[k].leaves.length;
  _offsets[key] = n;
  return n;
}

function drawLinks(){
  const tree = stage.querySelector('.tree');
  const svg = stage.querySelector('svg.links');
  if (!tree || !svg) return;
  const s = state.scale || 1;
  const base = tree.getBoundingClientRect();
  const rel = el => {
    const r = el.getBoundingClientRect();
    return { l: (r.left - base.left) / s, r: (r.right - base.left) / s,
             t: (r.top - base.top) / s, b: (r.bottom - base.top) / s,
             cy: (r.top + r.height / 2 - base.top) / s };
  };
  const root = rel(tree.querySelector('.node.root'));
  const parts = [];
  tree.querySelectorAll('.bg-group').forEach(g => {
    const br = g.querySelector('.branch');
    const b = rel(br);
    const mx = (root.r + b.l) / 2;
    parts.push(`<path d="M${root.r},${root.cy} C${mx},${root.cy} ${mx},${b.cy} ${b.l},${b.cy}"/>`);
    if (g.querySelector('.leaves').style.display === 'none') return;
    g.querySelectorAll('.leaf').forEach(lf => {
      const l = rel(lf);
      const m2 = (b.r + l.l) / 2;
      parts.push(`<path d="M${b.r},${b.cy} C${m2},${b.cy} ${m2},${l.cy} ${l.l},${l.cy}"/>`);
    });
  });

  const w = Math.max(tree.offsetWidth, 10);
  const h = Math.max(tree.offsetHeight, 10);
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = parts.join('');
}

/* ---------------- 变换 ---------------- */
function apply(){
  stage.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
  $('#zoomLabel').textContent = Math.round(state.scale * 100) + '%';
}
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }

function zoomAt(k, cx, cy){
  const rect = mapwrap.getBoundingClientRect();
  const mx = cx != null ? cx - rect.left : rect.width / 2;
  const my = cy != null ? cy - rect.top : rect.height / 2;
  const ns = clamp(state.scale * k, 0.28, 2.4);
  const ratio = ns / state.scale;
  state.tx = mx - (mx - state.tx) * ratio;
  state.ty = my - (my - state.ty) * ratio;
  state.scale = ns;
  apply();
}

function fit(){
  const tree = stage.querySelector('.tree');
  if (!tree) return;
  const rect = mapwrap.getBoundingClientRect();
  const pad = 34;
  const w = tree.offsetWidth, h = tree.offsetHeight;
  const s = clamp(Math.min((rect.width - pad * 2) / w, (rect.height - pad * 2) / h), 0.35, 1.25);
  state.scale = s;
  state.tx = (rect.width - w * s) / 2;
  state.ty = Math.max(16, (rect.height - h * s) / 2);
  apply();
}

/* ---------------- 交互 ---------------- */
/* 注意：不能用 setPointerCapture，否则 click 会被重定向到画布，卡片点不开 */
let drag = null, justDragged = false;
mapwrap.addEventListener('pointerdown', e => {
  if (e.target.closest('button,a,input')) return;
  drag = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
  justDragged = false;
  mapwrap.classList.add('drag');
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) justDragged = true;
  state.tx = drag.tx + (e.clientX - drag.x);
  state.ty = drag.ty + (e.clientY - drag.y);
  apply();
});
window.addEventListener('pointerup', () => {
  if (!drag) return;
  drag = null;
  mapwrap.classList.remove('drag');
});
mapwrap.addEventListener('click', e => {
  if (justDragged){ e.stopPropagation(); e.preventDefault(); justDragged = false; }
}, true);

mapwrap.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.shiftKey){ state.tx -= e.deltaY; apply(); return; }
  zoomAt(e.deltaY < 0 ? 1.09 : 1 / 1.09, e.clientX, e.clientY);
}, { passive: false });

$('#btnIn').onclick = () => zoomAt(1.16);
$('#btnOut').onclick = () => zoomAt(1 / 1.16);
$('#btnFit').onclick = fit;
$('#btnTheme').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  store.set('ml.theme', dark ? 'light' : 'dark');
};

let allOpen = false;
$('#btnExpand').onclick = () => {
  allOpen = !allOpen;
  const ch = chOf(state.idx);
  const arr = [];
  let n = 0;
  ch.branches.forEach(b => b.leaves.forEach(() => { arr.push(n++); }));
  state.open[chId(state.idx)] = allOpen ? arr : [];
  store.set('ml.open.v2', state.open);
  renderChapter();
  $('#btnExpand').textContent = allOpen ? '收起全部' : '展开全部';
};

function go(i){
  state.idx = clamp(i, 0, DATA.chapters.length - 1);
  state._fitted = false;
  allOpen = false;
  $('#btnExpand').textContent = '展开全部';
  renderChapter();
  refreshNav();
  location.hash = chId(state.idx);
  $('#q').value = ''; $('#hit').textContent = '';
  stage.querySelectorAll('.leaf.dim').forEach(e => e.classList.remove('dim'));
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') go(state.idx + 1);
  else if (e.key === 'ArrowLeft') go(state.idx - 1);
  else if (e.key === '+' || e.key === '=') zoomAt(1.16);
  else if (e.key === '-') zoomAt(1 / 1.16);
  else if (e.key.toLowerCase() === 'f') fit();
  else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});

/* ---------------- 搜索 ---------------- */
let hits = [], hitI = -1;
function search(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('.leaf').forEach(e => e.classList.remove('dim'));
  hits = []; hitI = -1;
  if (!q){ $('#hit').textContent = ''; return; }
  document.querySelectorAll('.leaf').forEach(el => {
    const txt = el.textContent.toLowerCase();
    if (txt.includes(q)) hits.push(el); else el.classList.add('dim');
  });
  $('#hit').textContent = hits.length ? `${hits.length} 处` : '无结果';
  if (hits.length){
    hitI = 0;
    hits[0].classList.add('open');
    requestAnimationFrame(() => { drawLinks(); centerOn(hits[0]); });
  }
}
function centerOn(el){
  const r = el.getBoundingClientRect(), w = mapwrap.getBoundingClientRect();
  state.tx += (w.left + w.width / 2) - (r.left + r.width / 2);
  state.ty += (w.top + w.height / 2) - (r.top + r.height / 2);
  apply();
}
$('#q').addEventListener('input', e => search(e.target.value));
$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !hits.length) return;
  hitI = (hitI + 1) % hits.length;
  hits[hitI].classList.add('open');
  requestAnimationFrame(() => { drawLinks(); centerOn(hits[hitI]); });
});

/* ---------------- 启动 ---------------- */
if (store.get('ml.theme', 'light') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
const initial = DATA.chapters.findIndex(c => c.id === (location.hash || '').replace('#', ''));
buildNav();
go(initial >= 0 ? initial : 0);
window.addEventListener('resize', () => { drawLinks(); });
</script>
</body>
</html>
