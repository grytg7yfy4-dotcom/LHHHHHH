<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastAPI 知识网络 · 黑马 68 集</title>
<meta name="description" content="黑马《FastAPI 从入门到实战》68 集：看板 / 思维导图双视图，点开有知识点，底部可跳 B 站对应分集。">
<style>
:root{
  --bg:#f6f8fc;--panel:#fff;--ink:#0f172a;--sub:#475569;--mut:#8b98ad;
  --line:#e3e9f2;--line2:#d6deea;
  --blue:#2563eb;--green:#0f7a5a;
  --done:#059669;--donebg:#e9f9f1;--doneline:#8fd9b8;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
  --mono:"Consolas","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);height:100%;display:flex;flex-direction:column;
  font:13px/1.5 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;overflow:hidden}
a{color:var(--blue);text-decoration:none}

.hdr{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:0 16px;height:44px;
  background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.hdr::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;flex:0 0 auto}
.brand b{font-size:14px;letter-spacing:-.2px}
.brand span{font-size:11px;color:var(--mut)}
.tabs{display:flex;gap:2px;flex:0 0 auto}
.tabs a{padding:5px 11px;border-radius:7px;color:var(--sub);font-size:12.5px;white-space:nowrap}
.tabs a:hover{background:#f2f6fc;color:var(--ink)}
.tabs a.on{background:#eef4ff;color:var(--blue);font-weight:700}

.bar{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn{height:26px;padding:0 10px;border:1px solid var(--line);background:#fff;color:var(--sub);
  border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--line2);background:#fbfcfe}
.btn.on{background:#eef4ff;border-color:#c9dcff;color:var(--blue);font-weight:700}
.spacer{flex:1 1 auto}
.search{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:6px;font-size:12px;
  font-family:inherit;outline:none;width:200px}
.search:focus{border-color:#9dc0ff;box-shadow:0 0 0 3px #eaf2ff}
.count{font-size:12px;color:var(--mut);white-space:nowrap}
.count b{color:var(--done);font-size:12.5px}

.main{flex:1 1 auto;overflow:auto;padding:14px 16px 70px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  overflow:hidden;display:flex;flex-direction:column}
.card-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(#fff,#fbfcfe);cursor:pointer;user-select:none}
.card-no{font-family:var(--mono);font-size:11.5px;color:#fff;background:var(--blue);
  border-radius:5px;padding:1px 6px;font-weight:700}
.card-name{font-size:13px;font-weight:700}
.card-stat{margin-left:auto;font-size:11.5px;color:var(--mut)}
.card-stat b{color:var(--done)}
.card.closed .card-body{display:none}
.card-body{padding:4px 0}

.row{display:flex;align-items:center;gap:8px;padding:4px 12px;cursor:pointer;border-left:3px solid transparent}
.row:hover{background:#f8fbff}
.row.done{background:var(--donebg);border-left-color:var(--doneline)}
.row.done .row-p{color:var(--done)}
.row.done .row-t{color:var(--green);font-weight:600}
.row-p{font-family:var(--mono);font-size:11px;color:var(--mut);flex:0 0 34px;text-align:right}
.row-t{flex:1 1 auto;font-size:12.4px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-go{flex:0 0 auto;font-size:11px;color:#9db3d6;padding:0 3px}
.row-go:hover{color:var(--blue)}
.row-mark{flex:0 0 auto;width:17px;height:17px;border-radius:99px;border:1px solid var(--line2);
  background:#fff;color:var(--mut);font-size:10.5px;line-height:15px;text-align:center;cursor:pointer}
.row.done .row-mark{background:var(--done);border-color:var(--done);color:#fff}

.mapview{display:none}
.mapview.on{display:block}
.mtree{display:flex;align-items:flex-start;gap:30px;min-width:max-content;padding:8px 4px}
.mcol{display:flex;flex-direction:column;gap:16px}
.mnode{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  padding:9px 14px;font-size:12.5px;white-space:nowrap}
.mnode.root{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;font-size:13.5px;
  padding:14px 18px;text-align:center}
.mnode.root span{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:3px}
.mnode.chap{font-weight:700;border-left:4px solid var(--blue)}
.mnode.chap i{font-style:normal;font-size:11px;color:var(--mut);font-weight:400;margin-left:6px}
.mbranch{display:flex;align-items:center;gap:0}
.mbranch::after{content:"";display:block;width:20px;height:1px;background:var(--line2)}
.meps{display:flex;flex-direction:column;gap:4px;border-left:1px dashed var(--line2);padding-left:13px}
.mep{display:flex;align-items:center;gap:6px;font-size:11.8px;color:var(--sub);background:#fff;
  border:1px solid var(--line);border-radius:99px;padding:2px 10px 2px 7px;cursor:pointer;white-space:nowrap}
.mep:hover{border-color:#c9dcff;background:#f8fbff}
.mep.done{background:var(--donebg);border-color:var(--doneline);color:var(--green)}
.mep b{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
.mep.done b{color:var(--done)}
.mep a{color:#9db3d6;font-size:10.5px;padding-left:2px}
.mep a:hover{color:var(--blue)}

/* 详情抽屉 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.28);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:430px;max-width:92vw;background:#fff;
  border-left:1px solid var(--line);box-shadow:-8px 0 32px rgba(15,23,42,.12);
  transform:translateX(100%);transition:transform .22s;z-index:41;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.dw-hd{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dw-kicker{font-family:var(--mono);font-size:11.5px;color:var(--mut);display:flex;gap:8px;align-items:center}
.dw-pill{background:#eef4ff;color:var(--blue);border-radius:5px;padding:1px 7px;font-weight:700}
.dw-pill.done{background:var(--donebg);color:var(--done)}
.dw-title{font-size:16px;font-weight:700;margin-top:8px;line-height:1.45}
.dw-sub{font-size:11.5px;color:var(--mut);margin-top:5px}
.dw-body{flex:1 1 auto;overflow:auto;padding:16px 18px 24px}
.dw-h{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.4px;margin:4px 0 10px}
.pt{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed #eef2f8;font-size:13px;color:var(--sub)}
.pt:last-child{border-bottom:none}
.pt i{flex:0 0 auto;width:17px;height:17px;border-radius:99px;background:#eef4ff;color:var(--blue);
  font-size:10.5px;font-style:normal;line-height:17px;text-align:center;margin-top:1px}
.dw-ft{flex:0 0 auto;padding:12px 18px 16px;border-top:1px solid var(--line);background:#fbfcfe;
  display:flex;flex-direction:column;gap:8px}
.dw-link{display:flex;align-items:center;justify-content:center;gap:7px;height:38px;border-radius:9px;
  background:var(--blue);color:#fff;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.dw-link:hover{background:#1d4ed8;color:#fff}
.dw-actions{display:flex;gap:8px}
.dw-actions .btn{flex:1;height:32px;font-size:12.5px}
.dw-mark{background:#fff;border-color:var(--doneline);color:var(--done);font-weight:700}
.dw-mark.on{background:var(--done);border-color:var(--done);color:#fff}

.empty{padding:50px;text-align:center;color:var(--mut);font-size:13px}
.foot{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:rgba(246,248,252,.94);border-top:1px solid var(--line);
  backdrop-filter:blur(6px);font-size:11.5px;color:var(--mut);z-index:30}
.foot a{color:var(--sub)}
.foot .right{margin-left:auto;display:flex;gap:8px}
.pill{padding:5px 12px;border:1px solid var(--line2);background:#fff;border-radius:99px;
  color:var(--sub);font-size:11.5px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
.pill:hover{color:var(--blue);border-color:#c9dcff}

@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .search{width:120px}
  .hdr{padding:6px 10px;height:auto;flex-wrap:wrap}
  .drawer{width:100%}
}
</style>
</head>

<script>

,"pts":["批量删除","二次确认","事务保证"]},{"p":57,"t":"收藏模块-总结","full":"57-头条项目-收藏模块-总结","pts":["收藏模块串讲","表设计回顾","接口约定"]},{"p":58,"t":"添加浏览历史-思路分析","full":"58-头条项目-添加浏览历史-思路分析","pts":["记录浏览时间","同一新闻覆盖更新","频率控制"]},{"p":59,"t":"获取浏览历史列表-思路分析","full":"59-头条项目-获取浏览历史列表-思路分析","pts":["按时间倒序","分页","关联新闻信息"]},{"p":60,"t":"删除单条浏览纪记录-思路分析","full":"60-头条项目-删除单条浏览纪记录-思路分析","pts":["删除单条历史","权限校验","删除不存在的处理"]},{"p":61,"t":"清空浏览历史列表-思路分析","full":"61-头条项目-清空浏览历史列表-思路分析","pts":["清空当前用户全部历史","事务","确认后执行"]}]},{"no":"05","name":"缓存与 AI","eps":[{"p":62,"t":"缓存简介及安装Redis服务端","full":"62-头条项目-缓存简介及安装Redis服务端","pts":["Redis 是什么、用在哪","安装服务端","命令行试一下"]},{"p":63,"t":"安装和配置Redis客户端","full":"63-头条项目-安装和配置Redis客户端","pts":["redis-py 客户端","连接池","连接配置放环境变量"]},{"p":64,"t":"封装缓存操作方法","full":"64-头条项目-封装缓存操作方法","pts":["封装 get / set / delete","对象要序列化","异常兜底"]},{"p":65,"t":"设计缓存策略","full":"65-头条项目-设计缓存策略","pts":["缓存什么数据","过期时间怎么定","缓存击穿 / 雪崩"]},{"p":66,"t":"缓存新闻列表","full":"66-头条项目-缓存新闻列表","pts":["先读缓存，没有再查库","查库后写回缓存","列表缓存怎么失效"]},{"p":67,"t":"AI问答功能","full":"67-头条项目-AI问答功能","pts":["把模型调用接进接口","流式返回","密钥与环境变量"]},{"p":68,"t":"缓存和调用模型-总结","full":"68-头条项目-缓存和调用模型-总结","pts":["缓存 + 模型的整体串讲","性能收益","下一步能做什么"]}]}];
const DEFAULT_LEARNED = [2, 3, 4, 5, 7, 8, 10, 14, 17, 18, 19, 20, 26, 27, 28, 32, 36, 47];
const BV = "BV1zV2QBtE39";
const KEY = "fastapi-learned-v1";

let learned = load();
let filter = "all";
let kw = "";
let view = "board";
try { view = localStorage.getItem("fastapi-view") || "board"; } catch (e) {}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return new Set(JSON.parse(raw));
  } catch (e) {}
  return new Set(DEFAULT_LEARNED);
}
function save() { try { localStorage.setItem(KEY, JSON.stringify([...learned])); } catch (e) {} }
function totalEps() { return BOARD.reduce((s, c) => s + c.eps.length, 0); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function epUrl(p) { return "https://www.bilibili.com/video/" + BV + "?p=" + p; }

function findEp(p) {
  for (const ch of BOARD) for (const e of ch.eps) if (e.p === p) return { ch, e };
  return null;
}

const gridEl = document.getElementById("grid");
const mapEl = document.getElementById("map");
const qEl = document.getElementById("q");

function updateCount() {
  document.getElementById("cDone").textContent = learned.size;
  document.getElementById("cTodo").textContent = totalEps() - learned.size;
}

/* ---------------- 看板 ---------------- */
function render() {
  let html = "", shown = 0;
  BOARD.forEach((ch, ci) => {
    const eps = ch.eps.filter(e => {
      const isDone = learned.has(e.p);
      if (filter === "done" && !isDone) return false;
      if (filter === "todo" && isDone) return false;
      if (kw) {
        const hay = (e.t + " " + e.pts.join(" ") + " P" + e.p + " " + ch.name).toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    });
    if (!eps.length) return;
    shown += eps.length;
    const d = ch.eps.filter(e => learned.has(e.p)).length;
    html += '<section class="card" data-ci="' + ci + '">';
    html += '<div class="card-hd"><span class="card-no">' + ch.no + '</span>';
    html += '<span class="card-name">' + ch.name + '</span>';
    html += '<span class="card-stat">已学 <b>' + d + '</b> / ' + ch.eps.length + '</span></div>';
    html += '<div class="card-body">';
    eps.forEach(e => {
      const on = learned.has(e.p);
      html += '<div class="row' + (on ? " done" : "") + '" data-p="' + e.p + '">';
      html += '<span class="row-p">P' + e.p + '</span>';
      html += '<span class="row-t">' + esc(e.t) + '</span>';
      html += '<a class="row-go" href="' + epUrl(e.p) + '" target="_blank" rel="noopener">↗</a>';
      html += '<span class="row-mark" data-mark="' + e.p + '">' + (on ? "✓" : "?") + '</span>';
      html += '</div>';
    });
    html += '</div></section>';
  });
  if (!shown) html = '<div class="empty">没有匹配的集，换个词或切回「全部」。</div>';
  gridEl.innerHTML = html;

  gridEl.querySelectorAll(".row").forEach(row => {
    row.addEventListener("click", ev => {
      if (ev.target.dataset.mark) return;
      if (ev.target.tagName === "A") return;
      openDetail(Number(row.dataset.p));
    });
  });
  gridEl.querySelectorAll(".row-mark").forEach(b => {
    b.addEventListener("click", ev => {
      ev.stopPropagation();
      toggle(Number(b.dataset.mark));
    });
  });
  gridEl.querySelectorAll(".card-hd").forEach(hd => {
    hd.addEventListener("click", () => hd.parentElement.classList.toggle("closed"));
  });
}

/* ---------------- 思维导图 ---------------- */
function renderMap() {
  let html = '<div class="mtree"><div class="mcol"><div class="mnode root">FastAPI<span>' +
             totalEps() + ' 集 · 已学 ' + learned.size + '</span></div></div><div class="mcol">';
  BOARD.forEach(ch => {
    const d = ch.eps.filter(e => learned.has(e.p)).length;
    html += '<div class="mbranch"><div class="mnode chap">' + ch.no + ' ' + ch.name +
            '<i>' + d + '/' + ch.eps.length + '</i></div><div class="meps">';
    ch.eps.forEach(e => {
      const on = learned.has(e.p);
      html += '<span class="mep' + (on ? " done" : "") + '" data-p="' + e.p + '">' +
              '<b>P' + e.p + '</b>' + esc(e.t) +
              '<a href="' + epUrl(e.p) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗</a></span>';
    });
    html += '</div></div>';
  });
  html += '</div></div>';
  mapEl.innerHTML = html;
  mapEl.querySelectorAll(".mep").forEach(el => {
    el.addEventListener("click", ev => {
      if (ev.target.tagName === "A") return;
      openDetail(Number(el.dataset.p));
    });
  });
}

/* ---------------- 详情 ---------------- */
const maskEl = document.getElementById("mask");
const drawerEl = document.getElementById("drawer");
let curP = null;

function openDetail(p) {
  const hit = findEp(p);
  if (!hit) return;
  curP = p;
  const { ch, e } = hit;
  const on = learned.has(p);

  document.getElementById("dwP").textContent = "P" + p;
  document.getElementById("dwP").className = "dw-pill" + (on ? " done" : "");
  document.getElementById("dwFull").textContent = "第 " + p + " / 68 集";
  document.getElementById("dwTitle").textContent = e.t;
  document.getElementById("dwSub").textContent = ch.no + " " + ch.name + " · 原视频标题：" + e.full;

  let pts = "";
  if (e.pts && e.pts.length) {
    e.pts.forEach((t, i) => { pts += '<div class="pt"><i>' + (i + 1) + '</i><span>' + esc(t) + '</span></div>'; });
  } else {
    pts = '<div class="pt"><i>·</i><span>这一集的知识点还没整理。</span></div>';
  }
  document.getElementById("dwPts").innerHTML = pts;

  const mk = document.getElementById("dwMark");
  mk.textContent = on ? "已学（点击取消）" : "标记为已学";
  mk.className = "btn dw-mark" + (on ? " on" : "");

  document.getElementById("dwLink").href = epUrl(p);

  maskEl.classList.add("on");
  drawerEl.classList.add("on");
}

function closeDetail() {
  maskEl.classList.remove("on");
  drawerEl.classList.remove("on");
  curP = null;
}

function toggle(p) {
  if (learned.has(p)) learned.delete(p); else learned.add(p);
  save(); updateCount();
  if (view === "board") render(); else renderMap();
  if (curP === p) openDetail(p);
}

maskEl.addEventListener("click", closeDetail);
document.getElementById("dwClose").addEventListener("click", closeDetail);
document.getElementById("dwMark").addEventListener("click", () => { if (curP) toggle(curP); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

/* ---------------- 视图切换 ---------------- */
function applyView() {
  gridEl.style.display = view === "board" ? "" : "none";
  mapEl.classList.toggle("on", view === "map");
  document.getElementById("toolbar").style.display = view === "board" ? "" : "none";
  document.getElementById("viewBtn").textContent = view === "board" ? "切到思维导图" : "切回看板";
  if (view === "map") renderMap(); else render();
}
document.getElementById("viewBtn").addEventListener("click", () => {
  view = view === "board" ? "map" : "board";
  try { localStorage.setItem("fastapi-view", view); } catch (e) {}
  applyView();
});

/* ---------------- 事件 ---------------- */
qEl.addEventListener("input", () => { kw = qEl.value.trim().toLowerCase(); render(); });
document.querySelectorAll(".btn[data-f]").forEach(b => {
  b.addEventListener("click", () => {
    filter = b.dataset.f;
    document.querySelectorAll(".btn[data-f]").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
});
document.getElementById("expandAll").addEventListener("click", () => {
  gridEl.querySelectorAll(".card").forEach(c => c.classList.remove("closed"));
});
document.getElementById("collapseAll").addEventListener("click", () => {
  gridEl.querySelectorAll(".card").forEach(c => c.classList.add("closed"));
});
document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify([...learned].sort((a, b) => a - b), null, 2)],
                        {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fastapi-learned.json";
  a.click();
});
document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      learned = new Set(JSON.parse(reader.result).map(Number));
      save(); updateCount(); if (view === "board") render(); else renderMap();
    } catch (e) { alert("文件格式不对，应该是一个数组，例如 [1,2,3]"); }
  };
  reader.readAsText(f);
});

updateCount();
applyView();
</script>
</body>
</html>
