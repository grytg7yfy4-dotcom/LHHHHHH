<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>廖恒 · 知识地图</title>
<meta name="description" content="从 Python 第 80 集到 Asset-Lite 实例的知识地图：阶段、依赖与验收。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="map.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <b>廖恒 · 知识地图</b>
      <span id="sub">加载中…</span>
    </div>
    <nav class="tabs">
      <a href="../index.html#/progress">主页</a>
      <a href="../blog/">博客</a>
      <a href="./" class="on">知识地图</a>
      <a href="python.html">Python 导图</a>
    </nav>
  </div>
</header>

<main class="map-page">

  <div class="map-bar">
    <div class="seg" id="seg">
      <button data-view="graph" class="on">网状图</button>
      <button data-view="list">按阶段</button>
    </div>
    <div class="tools">
      <button id="zoom-out" title="缩小">−</button>
      <span id="zoom">100%</span>
      <button id="zoom-in" title="放大">＋</button>
      <button id="fit" title="缩放到刚好放得下">适应窗口</button>
    </div>
  </div>

  <div class="map-stage" id="stage">
    <div class="world" id="world">
      <div class="bands" id="bands"></div>
      <svg class="edges" id="edges"></svg>
      <div class="nodes" id="nodes"></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="stage-list hidden" id="stageList"></div>

</main>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel" aria-hidden="true">
  <div class="phead">
    <span class="stage-tag" id="p-stage"></span>
    <h2 id="p-title"></h2>
    <button id="p-close" aria-label="关闭">×</button>
  </div>
  <div class="pbody">
    <div class="md" id="p-body"></div>
    <div class="plinks" id="p-links"></div>
  </div>
</aside>

<footer class="wrap">
  <span>廖恒 · 知识地图</span>
  <a href="../index.html">主页</a>
  <a href="../blog/">博客</a>
  <span id="foot-updated"></span>
</footer>

<script src="data.js"></script>
<script src="../js/md.js"></script>
<script src="map.js"></script>
</body>
</html>
