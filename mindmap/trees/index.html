<header class="top">

    <div class="brand">
      <b>廖恒 · 导图库</b>

<main class="wrap trees-page">

  <div class="picker" id="picker"></div>

  <div class="bar">
    <div class="meta" id="meta"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="在导图里搜…（/ 聚焦）" autocomplete="off">

      <button class="btn" id="collapse">收到两层</button>

  <div class="card tree-card">
    <div class="rootline" id="rootline"></div>
    <div id="tree" class="tree"></div>
  </div>

  <p class="hint">
    点前面的三角展开/收起；搜索会只留下命中的分支，并标黄关键词。
    这些树是从 <code>.xmind</code> 的 <code>content.xml</code> 里原样读出来的，节点一个没删。
    想改内容：用 XMind 改完重新导出，或直接改 <code>mindmap/trees/data.js</code>。
  </p>
