<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML / CSS / JS 知识网络 · 808 个知识点</title>
<meta name="description" content="按三门 B 站网课整理的 HTML/CSS/JS 知识网络：808 个知识点、51 个章节，支持思维导图与长链路图双视图，绿色为已学。">
<style>
:root{
  --bg:#f7f9fc;--panel:#fff;--ink:#0f172a;--sub:#475569;--muted:#8b98ad;
  --line:#e2e8f2;--grid:#eef2f8;
  --brand:#059669;--brand2:#2563eb;
  --cA:#2563eb;--cB:#0f7a5a;--cC:#b45309;
  --cAbg:#eaf1ff;--cBbg:#e4f5ee;--cCbg:#fdf1dd;
  --done:#059669;--donebg:#e7f8f0;--doneline:#7fcfae;
  --shadow:0 1px 3px rgba(15,23,42,.07),0 6px 18px rgba(15,23,42,.05);
  --mono:"Consolas","SFMono-Regular","Menlo",monospace;
}
html[data-theme=dark]{
  --bg:#0a1019;--panel:#111a27;--ink:#e8eefc;--sub:#b6c2d9;--muted:#7c8a9f;
  --line:#1d2938;--grid:#131e2c;
  --done:#34d399;--donebg:#0d2a22;--doneline:#1e6b52;
  --cA:#6ba4ff;--cB:#4dd6a4;--cC:#e3b364;
  --cAbg:#1a2740;--cBbg:#14291f;--cCbg:#2b2313;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;position:relative;
  display:flex;flex-direction:column;height:100%;
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
a{color:var(--brand2);text-decoration:none}

.bar{position:relative;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:4px}
.brand b{font-size:14.5px}
.brand span{font-size:10.5px;color:var(--muted)}
.spacer{flex:1}
.search{position:relative}
.search input{width:200px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;
  padding:6px 10px 6px 28px;font-size:12px;outline:none;font-family:inherit}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
.search:before{content:"⌕";position:absolute;left:9px;top:3px;font-size:15px;color:var(--muted)}
.tb{display:flex;align-items:center;gap:1px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.tb button{border:none;background:none;color:var(--sub);font-size:12px;padding:5px 9px;cursor:pointer;font-family:inherit}
.tb button:hover{background:rgba(37,99,235,.08);color:var(--ink)}
.tb .lv{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:40px;text-align:center}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:9px;
  padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.btn:hover{color:var(--ink);border-color:var(--brand)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.legend .a i{background:var(--done)}
.legend .b i{background:#c7d2e0}

#stage{position:relative;flex:1;min-height:0;overflow:auto;cursor:grab;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px}
#stage.drag{cursor:grabbing}
#sizer{position:relative}
#world{position:absolute;top:0;left:0;transform-origin:0 0}
svg.edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#nodes{position:absolute;top:0;left:0;width:100%;height:100%}

/* ---------- 思维导图节点 ---------- */
.node{position:absolute;display:flex;align-items:center;gap:7px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  cursor:pointer;user-select:none;transition:box-shadow .15s}
.node:hover{box-shadow:0 2px 6px rgba(15,23,42,.12),0 10px 26px rgba(15,23,42,.09)}
.node.root{background:linear-gradient(120deg,#0f766e,#1d4ed8);color:#fff;border:none;
  justify-content:center;font-weight:800;font-size:15px;border-radius:12px}
.node.course{font-weight:700;font-size:13px;padding-left:11px;border-left-width:4px;border-left-style:solid}
.node.course.cA{border-left-color:var(--cA)} .node.course.cB{border-left-color:var(--cB)}
.node.course.cC{border-left-color:var(--cC)}
.node.chap{font-weight:600;font-size:12.5px;padding:0 10px}
.node.ep{font-size:12px;padding:0 9px;color:var(--sub)}
.node .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.node .badge{font-family:var(--mono);font-size:10px;color:var(--muted);flex:0 0 auto}
.node.chap .badge{color:var(--doneline);font-weight:700}
.node.ep .dot{width:6px;height:6px;border-radius:50%;background:#c7d2e0;flex:0 0 auto}
.node.ep.done{background:var(--donebg);border-color:var(--doneline);color:#0b6b4c}
html[data-theme=dark] .node.ep.done{color:#7ff0c0}
.node.ep.done .dot{background:var(--done);box-shadow:0 0 0 3px rgba(5,150,105,.18)}
.node.ep.done .lbl{font-weight:600}
.node.ep .pn{font-family:var(--mono);font-size:10px;color:var(--muted);flex:0 0 auto}
.node.ep.done .pn{color:var(--done)}
.node .go{flex:0 0 auto;font-size:11px;color:var(--muted);padding:0 3px;border-radius:4px;opacity:0;transition:.12s}
.node:hover .go{opacity:1}
.node .go:hover{color:var(--brand2);background:rgba(37,99,235,.1)}
.node .togg{flex:0 0 auto;font-family:var(--mono);font-size:9px;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:0 3px;line-height:1.5}
.node.hit{box-shadow:0 0 0 2px #f59e0b,0 6px 18px rgba(245,158,11,.28)}

/* ---------- 长链路视图 ---------- */
.chain-wrap{padding:26px 30px 90px;min-width:max-content}
.chain-course{margin-bottom:26px}
.chain-title{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:9px;
  font-weight:700;font-size:13.5px;color:#fff;margin-bottom:14px}
.chain-course.cA .chain-title{background:linear-gradient(120deg,#1d4ed8,#2563eb)}
.chain-course.cB .chain-title{background:linear-gradient(120deg,#0f7a5a,#14a57f)}
.chain-course.cC .chain-title{background:linear-gradient(120deg,#b45309,#d97706)}
.chain-title .cnt{font-family:var(--mono);font-size:10.5px;opacity:.85;font-weight:400}
.chain-row{display:flex;align-items:stretch;gap:30px;padding-bottom:10px;overflow-x:auto}
.chain-card{position:relative;flex:0 0 auto;width:248px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);overflow:hidden}
.chain-card::after{content:"";position:absolute;right:-25px;top:50%;width:17px;height:2px;
  background:#c7d2e0;margin-top:-1px}
.chain-card::before{content:"";position:absolute;right:-22px;top:50%;width:7px;height:7px;
  border-top:2px solid #c7d2e0;border-right:2px solid #c7d2e0;
  margin-top:-4px;transform:rotate(45deg)}
.chain-card:last-child::before,.chain-card:last-child::after{display:none}
.cc-head{padding:9px 12px;font-weight:700;font-size:12.5px;color:#fff;line-height:1.4;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.chain-course.cA .cc-head{background:var(--cA)}
.chain-course.cB .cc-head{background:var(--cB)}
.chain-course.cC .cc-head{background:var(--cC)}
.cc-head .n{font-family:var(--mono);font-size:10px;opacity:.8;font-weight:400;flex:0 0 auto}
.cc-head .cnt{font-family:var(--mono);font-size:10px;opacity:.85;font-weight:400;flex:0 0 auto}
.cc-list{list-style:none;margin:0;padding:5px 6px 8px;max-height:290px;overflow-y:auto}
.cc-list::-webkit-scrollbar{width:5px}
.cc-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.cc-item{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:6px;
  font-size:11.5px;color:var(--sub);cursor:pointer;border-left:2px solid transparent}
.cc-item:hover{background:var(--bg)}
.cc-item .dot{width:5px;height:5px;border-radius:50%;background:#c7d2e0;flex:0 0 auto}
.cc-item .pn{font-family:var(--mono);font-size:9.5px;color:var(--muted);min-width:26px;flex:0 0 auto}
.cc-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-item .go{font-size:10px;color:var(--muted);padding:0 2px;border-radius:3px;opacity:0;flex:0 0 auto}
.cc-item:hover .go{opacity:1}
.cc-item .go:hover{color:var(--brand2);background:rgba(37,99,235,.1)}
.cc-item.done{background:var(--donebg);border-left-color:var(--doneline);color:#0b6b4c}
html[data-theme=dark] .cc-item.done{color:#7ff0c0}
.cc-item.done .dot{background:var(--done);box-shadow:0 0 0 2px rgba(5,150,105,.16)}
.cc-item.done .t{font-weight:600}

/* ---------- 切换按钮 ---------- */
.switch{position:fixed;right:18px;bottom:18px;z-index:40;border:none;border-radius:99px;
  background:#0f172a;color:#fff;font-size:12.5px;font-weight:600;padding:11px 20px;
  cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(15,23,42,.35);display:flex;align-items:center;gap:7px}
html[data-theme=dark] .switch{background:#059669}
.switch:hover{transform:translateY(-1px)}
.hint{position:fixed;left:16px;bottom:16px;z-index:30;font-size:10.5px;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;line-height:1.7}
.tip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;
  background:rgba(15,23,42,.86);color:#fff;font-size:11.5px;padding:6px 14px;border-radius:99px;
  pointer-events:none;opacity:0;transition:opacity .2s}
.tip.on{opacity:1}
@media(max-width:900px){
  .search input{width:130px}
  .legend,.hint{display:none}
  .brand span{display:none}
  .chain-card{width:200px}
}
</style>

var COL_X = [30, 232, 392, 700];
var COL_W = [168, 132, 262, 276];
var ROW_EP = 27, ROW_OTHER = 38;
var PAD = 40;
var CNAME = {A:"HTML + CSS", B:"JavaScript", C:"ES6 ~ ES11"};

var collapsed = new Set();
var doneSet = new Set();
try {
  var sv = JSON.parse(localStorage.getItem("mm-web-done"));
  DATA.forEach(function (co) { co.chapters.forEach(function (ch) { ch.eps.forEach(function (e) {
    if (sv ? sv.indexOf(co.id + "-" + e.p) >= 0 : e.d) doneSet.add(co.id + "-" + e.p);
  }); }); });
} catch (err) { DATA.forEach(function (co) { co.chapters.forEach(function (ch) { ch.eps.forEach(function (e) {
  if (e.d) doneSet.add(co.id + "-" + e.p);
}); }); }); }

DATA.forEach(function (co) { co.chapters.forEach(function (ch, i) { collapsed.add(co.id + "-ch" + i); }); });
DATA.forEach(function (co) { collapsed.add(co.id); });

var root = { id: "root", label: "前端基础", depth: 0, children: [] };
DATA.forEach(function (co) {
  var cn = { id: co.id, label: co.name, depth: 1, course: co.id, bv: co.bv, children: [] };
  co.chapters.forEach(function (ch, i) {
    var cid = co.id + "-ch" + i;
    var chn = { id: cid, label: ch.name, depth: 2, course: co.id, bv: co.bv, children: [] };
    ch.eps.forEach(function (e) {
      chn.children.push({ id: co.id + "-p" + e.p, label: e.t, depth: 3, p: e.p, s: e.s,
        course: co.id, bv: co.bv, doneKey: co.id + "-" + e.p });
    });
    cn.children.push(chn);
  });
  root.children.push(cn);
});

var TOTAL = 0;
DATA.forEach(function (co) { co.chapters.forEach(function (ch) { TOTAL += ch.eps.length; }); });

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

var nodes = [], edges = [], W = 0, H = 0;
function layout() {
  nodes = []; edges = [];
  var cursor = PAD;
  function walk(n, depth, parent) {
    n.x = COL_X[depth]; n.w = COL_W[depth];
    var isLeaf = depth === 3;
    var open = !collapsed.has(n.id);
    n.h = depth === 0 ? 52 : (depth === 1 ? 38 : (depth === 2 ? 32 : 24));
    nodes.push(n);
    if (parent) edges.push({ a: parent, b: n });
    if (isLeaf || !open || !n.children.length) {
      n.y = cursor; cursor += (isLeaf ? ROW_EP : ROW_OTHER); return;
    }
    var kids = n.children;
    kids.forEach(function (c) { walk(c, depth + 1, n); });
    var f = kids[0], l = kids[kids.length - 1];
    n.y = (f.y + f.h / 2 + l.y + l.h / 2) / 2 - n.h / 2;
  }
  walk(root, 0, null);
  W = COL_X[3] + COL_W[3] + PAD;
  H = Math.max(cursor + PAD, 400);
}

function render() {
  layout();
  var world = document.getElementById("world");
  var sizer = document.getElementById("sizer");
  var nodesEl = document.getElementById("nodes");
  var svg = document.getElementById("edges");
  var html = "";
  nodes.forEach(function (n) {
    var cls = "node d" + n.depth, inner = "";
    if (n.depth === 0) {
      cls += " root"; inner = '<span class="lbl" style="flex:none">' + esc(n.label) + '</span>';
    } else if (n.depth === 1) {
      cls += " course c" + n.course;
      var c = 0, d = 0;
      n.children.forEach(function (c2) { c2.children.forEach(function (e2) { c++;
        if (doneSet.has(e2.doneKey)) d++; }); });
      inner = '<span class="lbl">' + esc(n.label) + '</span><span class="badge">' + d + "/" + c + '</span>' +
              '<span class="togg">' + (collapsed.has(n.id) ? "+" : "−") + '</span>';
    } else if (n.depth === 2) {
      cls += " chap";
      var c3 = n.children.length, d3 = 0;
      n.children.forEach(function (e3) { if (doneSet.has(e3.doneKey)) d3++; });
      inner = '<span class="lbl">' + esc(n.label) + '</span>' +
              (d3 ? '<span class="badge">' + d3 + "/" + c3 + '</span>' : '<span class="badge" style="opacity:.35">' + c3 + '</span>') +
              '<span class="togg">' + (collapsed.has(n.id) ? "+" : "−") + '</span>';
    } else {
      var on = doneSet.has(n.doneKey);
      cls += " ep" + (on ? " done" : "");
      inner = '<span class="dot"></span><span class="pn">P' + n.p + '</span>' +
              '<span class="lbl">' + esc(n.label) + '</span>' +
              '<a class="go" href="https://www.bilibili.com/video/' + n.bv + '?p=' + n.p +
              '" target="_blank" rel="noopener" title="打开 B 站这一集">↗</a>';
    }
    html += '<div class="' + cls + '" data-id="' + n.id + '" data-d="' + n.depth +
            '"' + (n.doneKey ? ' data-k="' + n.doneKey + '"' : '') +
            ' style="left:' + n.x + 'px;top:' + n.y + 'px;width:' + n.w + 'px;height:' + n.h + 'px">' +
            inner + '</div>';
  });
  nodesEl.innerHTML = html;
  world.style.width = W + "px"; world.style.height = H + "px";

  var paths = "";
  edges.forEach(function (e) {
    var x1 = e.a.x + e.a.w, y1 = e.a.y + e.a.h / 2;
    var x2 = e.b.x, y2 = e.b.y + e.b.h / 2;
    var mx = (x1 + x2) / 2;
    var isDone = e.b.doneKey && doneSet.has(e.b.doneKey);
    var col = e.b.depth === 3 ? (isDone ? "var(--doneline)" : "#cdd8e6") :
              (e.b.depth === 2 ? "#b8c6da" : "#9fb3cd");
    paths += '<path d="M' + x1 + ' ' + y1 + 'C' + mx + ' ' + y1 + ',' + mx + ' ' + y2 + ',' + x2 + ' ' + y2 +
             '" fill="none" stroke="' + col + '" stroke-width="' + (e.b.depth === 3 ? 1 : 1.6) + '"/>';
  });
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = paths;
  sizer.style.width = W * scale + "px";
  sizer.style.height = H * scale + "px";
  world.style.transform = "scale(" + scale + ")";
  refreshStats();
}

/* ---------- 长链路 ---------- */
function renderChain() {
  var wrap = document.getElementById("chainWrap");
  var h = "";
  DATA.forEach(function (co, ci) {
    var cnt = 0, dn = 0;
    co.chapters.forEach(function (ch) { ch.eps.forEach(function (e) {
      cnt++; if (doneSet.has(co.id + "-" + e.p)) dn++;
    }); });
    h += '<section class="chain-course c' + co.id + '">' +
         '<div class="chain-title">' + esc(co.name) +
         '<span class="cnt">' + dn + ' / ' + cnt + '</span></div>' +
         '<div class="chain-row">';
    co.chapters.forEach(function (ch, i) {
      var cd = 0;
      ch.eps.forEach(function (e) { if (doneSet.has(co.id + "-" + e.p)) cd++; });
      h += '<div class="chain-card"><div class="cc-head">' +
           '<span class="n">' + String(i + 1).padStart(2, "0") + '</span>' +
           '<span style="flex:1">' + esc(ch.name) + '</span>' +
           '<span class="cnt">' + cd + '/' + ch.eps.length + '</span></div>' +
           '<ul class="cc-list">';
      ch.eps.forEach(function (e) {
        var on = doneSet.has(co.id + "-" + e.p);
        h += '<li class="cc-item' + (on ? " done" : "") + '" data-k="' + co.id + "-" + e.p +
             '" title="' + esc(e.t) + '">' +
             '<span class="dot"></span><span class="pn">P' + e.p + '</span>' +
             '<span class="t">' + esc(e.t) + '</span>' +
             '<a class="go" href="https://www.bilibili.com/video/' + co.bv + '?p=' + e.p +
             '" target="_blank" rel="noopener">↗</a></li>';
      });
      h += '</ul></div>';
    });
    h += '</div></section>';
  });
  wrap.innerHTML = h;
  refreshStats();
}

function refreshStats() {
  var n = doneSet.size;
  document.getElementById("s-done").textContent = n + " / " + TOTAL;
  document.getElementById("lv").textContent = Math.round(scale * 100) + "%";
}

var scale = 1;
function setScale(s) {
  scale = Math.min(2, Math.max(0.12, s));
  document.getElementById("world").style.transform = "scale(" + scale + ")";
  document.getElementById("sizer").style.width = W * scale + "px";
  document.getElementById("sizer").style.height = H * scale + "px";
  refreshStats();
}
function fit() {
  var st = document.getElementById("stage");
  setScale(Math.min(1.1, Math.min(st.clientWidth / W, st.clientHeight / H) * 0.96));
  st.scrollTop = 0; st.scrollLeft = 0;
}

function save() {
  try { localStorage.setItem("mm-web-done", JSON.stringify(Array.from(doneSet))); } catch (e) {}
}

document.getElementById("world").addEventListener("click", function (e) {
  var go = e.target.closest("a.go");
  if (go) return;
  var el = e.target.closest(".node");
  if (!el) return;
  var d = Number(el.getAttribute("data-d"));
  if (d === 3) {
    var k = el.getAttribute("data-k");
    if (!k) return;
    if (doneSet.has(k)) doneSet.delete(k); else doneSet.add(k);
    save(); render();
    return;
  }
  var id = el.getAttribute("data-id");
  if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
  render();
});

document.getElementById("chainWrap").addEventListener("click", function (e) {
  var go = e.target.closest("a.go");
  if (go) return;
  var li = e.target.closest(".cc-item");
  if (!li) return;
  var k = li.getAttribute("data-k");
  if (!k) return;
  if (doneSet.has(k)) doneSet.delete(k); else doneSet.add(k);
  save(); renderChain();
});

      if (n.textContent.toLowerCase().indexOf(kw) >= 0) n.classList.add("hit");
    });
    showTip("匹配到 " + hit + " 个知识点");
  } else { showTip("没有匹配的知识点"); }
});

var tipT;
function showTip(t) {
  var el = document.getElementById("tip");
  el.textContent = t; el.classList.add("on");
  clearTimeout(tipT); tipT = setTimeout(function () { el.classList.remove("on"); }, 1800);
}

/* ---------- 视图切换 ---------- */
var mode = "map";
var swBtn = document.getElementById("switch");
swBtn.addEventListener("click", function () {
  mode = mode === "map" ? "chain" : "map";
  applyMode();
});
function applyMode() {
  var isMap = mode === "map";
  document.getElementById("viewMap").style.display = isMap ? "" : "none";
  document.getElementById("viewChain").style.display = isMap ? "none" : "";
  swBtn.textContent = isMap ? "切到长链路图" : "切到思维导图";
  document.getElementById("searchWrap").style.display = isMap ? "" : "none";
  document.getElementById("zoomWrap").style.display = isMap ? "" : "none";
  document.getElementById("mapBtns").style.display = isMap ? "" : "none";
  var st = document.getElementById("stage");
  st.style.overflow = isMap ? "auto" : "auto";
  if (!isMap) { renderChain(); st.scrollTop = 0; st.scrollLeft = 0; }
}

(function () {
  var st = document.getElementById("stage"), down = false, sx = 0, sy = 0, sl = 0, stp = 0;
  st.addEventListener("mousedown", function (e) {
    if (e.target.closest(".node,.cc-item")) return;
    down = true; st.classList.add("drag");
    sx = e.clientX; sy = e.clientY; sl = st.scrollLeft; stp = st.scrollTop;
  });
  window.addEventListener("mousemove", function (e) {
    if (!down) return;
    st.scrollLeft = sl - (e.clientX - sx);
    st.scrollTop = stp - (e.clientY - sy);
  });
  window.addEventListener("mouseup", function () { down = false; st.classList.remove("drag"); });
  st.addEventListener("wheel", function (e) {
    if (mode !== "map" || (!e.ctrlKey && !e.metaKey)) return;
    e.preventDefault();
    setScale(scale * (e.deltaY < 0 ? 1.1 : 0.9));
  }, { passive: false });
})();

var savedTheme = null;
try { savedTheme = localStorage.getItem("mm-theme"); } catch (e) {}
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

render();
applyMode();
fit();
</script>
</body>
