<rect x="475.0" y="614.0" width="268.0" height="54.0" rx="8" fill="#ddf0ee" stroke="#0d9488" stroke-width="1.2"/><text x="609.0" y="635.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">条件之间是互斥的 第一个条满足后面的</text><text x="609.0" y="656.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">条件都没有用</text>
