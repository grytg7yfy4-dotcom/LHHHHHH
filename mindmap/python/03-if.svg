<rect x="295.0" y="473.5" width="105.0" height="35.0" rx="9" fill="#0d9488" stroke="none" stroke-width="1.2"/><text x="347.5" y="496.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#ffffff">if else语句</text>
<rect x="444.0" y="528.0" width="178.0" height="33.0" rx="8" fill="#ddf0ee" stroke="#0d9488" stroke-width="1.2"/><text x="533.0" y="549.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">else：下的语句也要缩进</text>
<rect x="444.0" y="485.0" width="122.0" height="33.0" rx="8" fill="#ddf0ee" stroke="#0d9488" stroke-width="1.2"/><text x="505.0" y="506.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">else不需要条件</text>
<rect x="444.0" y="421.0" width="272.0" height="54.0" rx="8" fill="#ddf0ee" stroke="#0d9488" stroke-width="1.2"/><text x="580.0" y="442.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">if语句的条件成立就执行if：下的语句 如</text><text x="580.0" y="463.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">果条件不成立就执行else：下的语句</text>
