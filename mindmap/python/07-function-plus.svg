<rect x="431.0" y="719.0" width="200.0" height="33.0" rx="8" fill="#fce7dc" stroke="#ea580c" stroke-width="1.2"/><text x="531.0" y="740.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">语法：lambda 形参: 表达式</text>
<rect x="295.0" y="610.5" width="152.0" height="35.0" rx="9" fill="#ea580c" stroke="none" stroke-width="1.2"/><text x="371.0" y="633.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#ffffff">函数作为参数传递</text>
<rect x="491.0" y="676.0" width="236.0" height="33.0" rx="8" fill="#fce7dc" stroke="#ea580c" stroke-width="1.2"/><text x="609.0" y="697.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">好处：把逻辑抽出来，复用性更强</text>
<rect x="491.0" y="633.0" width="259.0" height="33.0" rx="8" fill="#fce7dc" stroke="#ea580c" stroke-width="1.2"/><text x="620.5" y="654.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">例：def test(func): return func(1, 2)</text>
<rect x="491.0" y="590.0" width="194.0" height="33.0" rx="8" fill="#fce7dc" stroke="#ea580c" stroke-width="1.2"/><text x="588.0" y="611.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">传的是计算逻辑，不是数据</text>
<rect x="491.0" y="547.0" width="264.0" height="33.0" rx="8" fill="#fce7dc" stroke="#ea580c" stroke-width="1.2"/><text x="623.0" y="568.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">函数本身也能当参数，传给另一个函数</text>
<rect x="295.0" y="293.5" width="152.0" height="35.0" rx="9" fill="#ea580c" stroke="none" stroke-width="1.2"/><text x="371.0" y="316.1" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#ffffff">函数多种传参方式</text>
<rect x="491.0" y="462.5" width="82.0" height="33.0" rx="8" fill="#fce7dc" stroke="#ea580c" stroke-width="1.2"/><text x="532.0" y="483.6" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">却省参数</text>
<rect x="611.0" y="505.0" width="193.0" height="32.0" rx="7" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="707.5" y="525.2" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="400" fill="#334155">不传就用默认值，传了就覆盖</text>
<rect x="611.0" y="463.0" width="154.0" height="32.0" rx="7" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="688.0" y="483.2" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="400" fill="#334155">默认值参数要放在最后</text>
<rect x="611.0" y="421.0" width="254.0" height="32.0" rx="7" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="738.0" y="441.2" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="400" fill="#334155">定义时给默认值：def f(name, age=18)</text>
<rect x="491.0" y="336.5" width="96.0" height="33.0" rx="8" fill="#fce7dc" stroke="#ea580c" stroke-width="1.2"/><text x="539.0" y="357.6" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">不定长参数</text>
<rect x="625.0" y="379.0" width="154.0" height="32.0" rx="7" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="702.0" y="399.2" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="400" fill="#334155">一般写在参数列表最后</text>
<rect x="625.0" y="337.0" width="239.0" height="32.0" rx="7" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="744.5" y="357.2" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="400" fill="#334155">**kwargs 关键字传递，收到的是字典</text>
<rect x="625.0" y="295.0" width="203.0" height="32.0" rx="7" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="726.5" y="315.2" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="400" fill="#334155">*args 位置传递，收到的是元组</text>
<rect x="491.0" y="210.5" width="96.0" height="33.0" rx="8" fill="#fce7dc" stroke="#ea580c" stroke-width="1.2"/><text x="539.0" y="231.6" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="500" fill="#0f172a">关键字参数</text>
<rect x="625.0" y="253.0" width="232.0" height="32.0" rx="7" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="741.0" y="273.2" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="400" fill="#334155">和位置参数混用时，位置参数写前面</text>
<rect x="625.0" y="211.0" width="193.0" height="32.0" rx="7" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/><text x="721.5" y="231.2" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="400" fill="#334155">顺序可以打乱，靠参数名对应</text>
