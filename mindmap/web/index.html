<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端知识网络 · HTML / CSS / JS（808 集 / 51 章）</title>
<meta name="description" content="HTML / CSS / JS 三门 B 站网课的知识网络：808 集、51 章，全链路图与思维导图双视图，绿色为已学。">
<style>
:root{
  --bg:#f6f8fc;--panel:#fff;--ink:#0f172a;--sub:#475569;--mut:#8b98ad;
  --line:#e3e9f2;--line2:#d6deea;--dot:#e6ecf5;
  --blue:#2563eb;--green:#0f7a5a;--orange:#b45309;
  --done:#059669;--donebg:#e9f9f1;--doneline:#8fd9b8;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
  --mono:"Consolas","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);height:100%;display:flex;flex-direction:column;
  font:13px/1.5 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;overflow:hidden}
a{color:var(--blue);text-decoration:none}

/* ---------- 顶栏 ---------- */
.hdr{flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:0 18px;height:46px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.brand b{font-size:14.5px;letter-spacing:-.2px}
.brand span{font-size:11px;color:var(--mut)}
.tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;padding:6px 12px;border-radius:8px;color:var(--sub);font-size:12.5px;white-space:nowrap}
.tabs a:hover{background:#f2f6fc;color:var(--ink);text-decoration:none}
.tabs a.on{background:#eef4ff;color:var(--blue);font-weight:700}

/* ---------- 工具栏 ---------- */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 18px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn{height:28px;padding:0 11px;border:1px solid var(--line);background:#fff;color:var(--sub);
  border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--line2);background:#fbfcfe}
.zoom{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;height:28px;background:#fff}
.zoom button{border:none;background:none;width:26px;height:100%;cursor:pointer;color:var(--sub);font-size:13px}
.zoom button:hover{background:#f2f6fc;color:var(--ink)}
.zoom span{width:44px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--mut)}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;height:28px;background:#fff}
.seg button{border:none;background:none;padding:0 11px;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:#f7f9fd;color:var(--ink)}
.seg button.on{background:#eef4ff;color:var(--blue);font-weight:700}
.search{position:relative;height:28px}
.search input{width:180px;height:28px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
  padding:0 10px 0 27px;font-size:12px;outline:none;font-family:inherit}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.search:before{content:"⌕";position:absolute;left:8px;top:3px;color:var(--mut);font-size:14px}
.legend{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--sub);margin-left:2px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.legend .done i{background:var(--done)}
.legend .todo i{background:#c3cddb}
.legend b{font-family:var(--mono);font-weight:600;color:var(--ink)}

/* ---------- 画布 ---------- */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:19px 19px;background-color:var(--bg)}
#chainView{position:absolute;inset:0;overflow:auto;padding:16px 18px 74px}
#mapView{position:absolute;inset:0;overflow:hidden;cursor:grab;display:none}
#mapView.on{display:block}
#mapView.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#nodes{position:absolute;left:0;top:0}

/* ---------- 长链路 ---------- */
.lane{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;min-width:max-content}
.lane-head{position:sticky;left:0;z-index:3;flex:0 0 auto;width:132px;background:var(--panel);
  border:1px solid var(--line);border-left-width:4px;border-radius:9px;padding:8px 10px;box-shadow:var(--shadow)}
.lane.cA .lane-head{border-left-color:var(--blue)}
.lane.cB .lane-head{border-left-color:var(--green)}
.lane.cC .lane-head{border-left-color:var(--orange)}
.lane-head b{display:block;font-size:12.5px;line-height:1.3}
.lane-head .cnt{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
.lane-cards{display:flex;align-items:flex-start;gap:34px;padding:2px 6px 12px}
.card{position:relative;flex:0 0 auto;width:238px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.card+.card:before{content:"";position:absolute;left:-27px;top:50%;width:20px;height:1.5px;background:#c9d5e4}
.card+.card:after{content:"";position:absolute;left:-11px;top:50%;width:7px;height:7px;margin-top:-4px;
  border-top:1.5px solid #c9d5e4;border-right:1.5px solid #c9d5e4;transform:rotate(45deg)}
.chead{display:flex;align-items:center;gap:7px;padding:8px 10px;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.cA .chead{background:linear-gradient(120deg,#1d4ed8,#3b82f6)}
.cB .chead{background:linear-gradient(120deg,#0f7a5a,#14a57f)}
.cC .chead{background:linear-gradient(120deg,#b45309,#d97706)}
.chead .no{font-family:var(--mono);font-size:10px;opacity:.75;font-weight:400}
.chead .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .cnt{font-family:var(--mono);font-size:10px;opacity:.9;font-weight:400}
.clist{list-style:none;margin:0;padding:5px 6px 8px;max-height:250px;overflow-y:auto}
.clist::-webkit-scrollbar{width:5px}
.clist::-webkit-scrollbar-thumb{background:#dbe3ee;border-radius:3px}
.ci{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:5px;font-size:11.5px;color:var(--sub);
  border-left:2px solid transparent;cursor:pointer}
.ci:hover{background:#f5f8fd}
.ci .pn{font-family:var(--mono);font-size:9.5px;color:var(--mut);min-width:25px;flex:0 0 auto}
.ci .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci.done{background:var(--donebg);border-left-color:var(--doneline);color:#0b6b4c}
.ci.done .pn{color:var(--done)}
.ci.done .t{font-weight:600}
.q{flex:0 0 auto;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);background:#fff;color:var(--mut);
  font-size:9.5px;line-height:1;cursor:pointer;padding:0;font-family:var(--mono)}
.q:hover{border-color:var(--blue);color:var(--blue)}
.card.closed .clist{display:none}

/* ---------- 思维导图 ---------- */
.node{position:absolute;display:flex;align-items:center;gap:7px;border-radius:8px;background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;user-select:none;white-space:nowrap}
.node:hover{box-shadow:0 3px 10px rgba(15,23,42,.13)}
.node.root{background:linear-gradient(120deg,#0f172a,#1e293b);color:#fff;border:none;border-radius:10px;
  flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:0 16px;font-weight:800}
.node.root small{font-weight:400;font-size:9.5px;opacity:.72;font-family:var(--mono)}
.node.course{color:#fff;font-weight:700;font-size:12.5px;padding:0 12px;border:none}
.node.course .cc{font-family:var(--mono);font-size:9px;opacity:.8;font-weight:400;margin-left:auto}
.node.course.cA{background:linear-gradient(120deg,#1d4ed8,#3b82f6)}
.node.course.cB{background:linear-gradient(120deg,#0f7a5a,#14a57f)}
.node.course.cC{background:linear-gradient(120deg,#b45309,#d97706)}
.node.leaf{font-size:12px;padding:0 6px 0 9px;border-left:3px solid var(--blue)}
.node.leaf.cB{border-left-color:var(--green)}
.node.leaf.cC{border-left-color:var(--orange)}
.node.leaf .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.node.leaf .cnt{font-family:var(--mono);font-size:9.5px;color:var(--mut)}
.node.leaf .cnt b{color:var(--done);font-weight:700}
.node.leaf:hover .nm{color:var(--ink)}
.node.leaf.hit{box-shadow:0 0 0 2px #f59e0b}

/* ---------- 底部 ---------- */
.foot{position:fixed;left:16px;bottom:14px;z-index:30;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:99px;padding:6px 13px;font-size:12px;color:var(--sub);box-shadow:var(--shadow)}
.pill:hover{color:var(--ink);text-decoration:none;border-color:var(--line2)}
.hint{font-size:10.5px;color:var(--mut);padding-left:4px;line-height:1.6}
.switch{position:fixed;right:16px;bottom:14px;z-index:40;border:none;border-radius:99px;background:#0f172a;color:#fff;
  font-size:12.5px;font-weight:600;padding:10px 18px;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 22px rgba(15,23,42,.3)}
.switch:hover{background:#1e293b}

/* ---------- 详情卡 ---------- */
#pop{position:fixed;z-index:70;display:none;flex-direction:column;width:376px;max-height:80vh;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  box-shadow:0 18px 48px rgba(15,23,42,.2),0 2px 8px rgba(15,23,42,.06)}
#pop.on{display:flex}
.ph{display:flex;align-items:center;gap:6px;padding:11px 12px 0;flex-wrap:wrap}
.pk{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--blue)}
.pc{padding:1px 6px;border-radius:4px;color:#fff;font-size:9.5px}
.pc.cA{background:var(--blue)}.pc.cB{background:var(--green)}.pc.cC{background:var(--orange)}
.pch{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.px{margin-left:auto;border:none;background:none;font-size:16px;line-height:1;color:var(--mut);cursor:pointer;padding:0 4px}
.px:hover{color:var(--ink)}
.pt{font-size:14.5px;font-weight:700;line-height:1.45;margin:7px 12px 3px;letter-spacing:-.2px}
.pm{display:flex;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--mut);margin:0 12px 9px}
.pm i{font-style:normal;opacity:.5}
.pm .on{color:var(--done);font-weight:700}
.pbody{overflow-y:auto;padding:0 12px 4px}
.psum{font-size:11.5px;line-height:1.65;color:var(--sub);background:#f7f9fd;border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;margin:0 0 8px}
.psum b{display:block;font-size:9px;letter-spacing:.12em;color:var(--mut);margin-bottom:2px}
.pnote{font-size:11.5px;line-height:1.72;color:#0b6b4c;background:var(--donebg);border:1px solid var(--doneline);
  border-radius:7px;padding:7px 9px;margin:0 0 9px}
.pnote b.lab{display:block;font-size:9px;letter-spacing:.12em;margin-bottom:2px;opacity:.85}
.pnote b{color:inherit}
.art{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;margin-bottom:9px}
.art svg{display:block;width:100%;height:auto}
.cap{font-size:9px;color:var(--mut);text-align:center;margin-top:3px}
.ph2{font-size:9.5px;letter-spacing:.12em;color:var(--mut);font-weight:700;margin:0 0 5px}
.plist{list-style:none;margin:0 0 8px;padding:0}
.plist li{position:relative;padding-left:13px;font-size:11.5px;line-height:1.7;color:var(--sub);margin-bottom:4px}
.plist li:before{content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--blue)}
.plist li b{color:var(--ink);font-weight:600}
.eps{list-style:none;margin:0;padding:0 0 6px}
.erow{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:none;
  padding:4px 6px;border-radius:5px;font-size:11.5px;color:var(--sub);cursor:pointer;font-family:inherit;
  border-left:2px solid transparent}
.erow:hover{background:#f5f8fd}
.erow.done{background:var(--donebg);border-left-color:var(--doneline);color:#0b6b4c}
.erow .pn{font-family:var(--mono);font-size:9.5px;color:var(--mut);min-width:27px;flex:0 0 auto}
.erow.done .pn{color:var(--done)}
.erow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .t b{font-weight:600}
.erow .go{color:var(--mut);font-size:10px;padding:0 3px;border-radius:3px}
.erow .go:hover{color:var(--blue);background:#eef4ff}
.pfoot{display:flex;gap:7px;padding:9px 12px 11px;border-top:1px solid var(--line);background:var(--panel)}
.pmark{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:7px;
  padding:8px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.pmark:hover{border-color:var(--done);color:var(--done)}
.pmark.on{background:var(--donebg);border-color:var(--doneline);color:#0b6b4c;font-weight:700}
.pgo{flex:1;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;border-radius:7px;
  padding:8px 10px;font-size:12px;font-weight:600}
.pgo:hover{background:#1d4ed8;text-decoration:none;color:#fff}
.empty{padding:60px 0;text-align:center;color:var(--mut);font-size:12px}

@media(max-width:860px){
  .search{display:none}
  .hdr{gap:10px;padding:0 10px}
  .brand span{display:none}
  .bar{padding:6px 10px;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .bar>*{flex:0 0 auto}
  .grow{display:none}
  .search input{width:120px}
  .legend{display:none}
  .lane-head{width:104px}
  #pop{width:calc(100vw - 20px)}
  .foot{left:10px;bottom:10px}
  .switch{right:10px;bottom:10px;padding:9px 14px}
}
</style>

var NOTES = {"A-9":"html 包住 head 与 body：head 放 meta / title / link，body 放可见内容。VSCode 里输入 <b>!</b> 再按 Tab 可直接生成这套骨架。","A-12":"<b>DOCTYPE</b> 声明 HTML5，不写会进怪异模式；<b>charset=UTF-8</b> 防中文乱码；<b>lang</b> 影响朗读与翻译。","A-18":"<b>div</b> 块级独占一行，<b>span</b> 行内跟随文字。布局用 div，包一小段文字用 span。","A-46":"<b>input 的 type</b> 决定形态：text 单行文本、password 显示圆点；placeholder 是提示文字，value 才是真正的值。","A-67":"类选择器 <b>.card</b> 选中所有 class=\"card\" 的元素，一个元素可挂多个类名（class=\"card active\"）。","A-86":"外部样式表用 <b>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;</b>，放 head 里；三种引入方式的优先级看「行内 &gt; 内部/外部，同位置看先后」。","A-92":"F12 打开 Elements 看最终生效的样式，被划掉的就是被覆盖的；先在面板里试改，再写回文件。","A-132":"<b>!important &gt; 行内 &gt; #id &gt; .class &gt; 标签</b>；同权重时后写的赢——这就是层叠。","A-138":"盒模型 = <b>content + padding + border + margin</b>，width 默认只算 content，所以加 padding 会撑大盒子。","A-143":"padding 会撑大盒子；<b>padding: 10px 20px</b> 是上下 10、左右 20。不想被撑大就设 box-sizing: border-box。","A-150":"margin 管盒子之间的间距；左右 auto 让固定宽度块水平居中；相邻上下 margin 会合并取大值。","A-225":"<b>relative</b> 相对自己原位偏移，原位置仍占着——最大用途是给 absolute 子元素当参照。","A-227":"<b>absolute</b> 相对最近的已定位祖先偏移，没有就相对初始包含块；它会脱标、不占位置。","A-231":"<b>fixed</b> 相对浏览器窗口固定，滚动不动，吸顶导航、返回顶部常用。","A-295":"<b>transition: 属性 时长 曲线 延迟</b>；只能过渡有中间值的属性（width / opacity / transform），display 不行。","A-418":"父元素 <b>display: flex</b> 后，直接子元素默认排成一行，成为 flex item。","A-420":"<b>justify-content</b> 管主轴：flex-start / center / space-between / space-around。","A-422":"<b>align-items</b> 管交叉轴（横排时是垂直），center 最常用；多行还要配 align-content。","A-425":"<b>flex: 1</b> = grow 1 + shrink 1 + basis 0%，用来占满剩余空间，是「左固定右自适应」的关键。","A-444":"<b>@media (max-width: 768px){…}</b> 断点内覆盖样式；移动优先则反过来用 min-width 逐级加宽。","B-12":"数组用 <b>[]</b> 声明，下标从 0 开始，<b>length</b> 是长度；取值和改值都靠下标。","B-16":"模板字符串用反引号，<b>${表达式}</b> 直接插值，还能换行，比拼字符串安全。","B-50":"<b>function 名(参数){…}</b>；参数是入口，没传就是 undefined；先声明后调用。","B-53":"<b>return</b> 把结果交出去并立刻结束函数；不写 return 得到 undefined。","B-65":"对象是键值对集合；取值 <b>obj.key</b> 或 obj[\"key\"]，改值直接赋值。","B-80":"DOM 是把 HTML 解析成的一棵树，document 是根，每个标签都是一个节点对象。","B-81":"<b>querySelector</b> 返回第一个匹配，querySelectorAll 返回 NodeList（要遍历或转成数组）。","B-82":"<b>textContent</b> 只改文字，<b>innerHTML</b> 会解析标签；插入用户输入用 textContent 防 XSS。","B-86":"<b>classList.add / remove / toggle / contains</b> 改类名，比直接改 style 更好维护。","B-89":"表单控件的值在 <b>.value</b>，checkbox 用 .checked；不要用 innerHTML 去读。","B-94":"<b>addEventListener(\"click\", fn)</b>；同一元素能绑多个监听，不会互相覆盖。","B-101":"事件对象 e：<b>e.target</b> 是真正触发的元素，e.currentTarget 是绑定监听的元素。","B-110":"<b>e.preventDefault()</b> 阻止默认行为（表单提交刷新、a 跳转）；stopPropagation 才是不让冒泡。","B-131":"<b>localStorage</b> 只能存字符串；对象要 JSON.stringify 存、JSON.parse 读，读的时候给默认值防报错。","B-134":"<b>map</b> 返回新数组、<b>join(\"\")</b> 拼成字符串——把数据渲染成 HTML 的标准组合。","B-158":"箭头函数 <b>() =&gt; {}</b> 没有自己的 this，会继承外层；单表达式可以省略 return。","B-192":"<b>try{…}catch(e){…}</b> 兜住可能失败的代码，throw 主动抛错，finally 一定执行。","C-24":"Promise 三种状态 pending / fulfilled / rejected；<b>then</b> 接成功，<b>catch</b> 接失败。","C-49":"<b>async</b> 函数一定返回 Promise；<b>await</b> 等结果，失败要用 try / catch 接。"};

var RULES = [
  {keys:["盒模型","盒子模型","边框","内边距","外边距","padding","margin","border"], art:"box", tag:"CSS 盒模型",
   points:["<b>四层结构</b>：content → padding → border → margin，从里到外。",

  {keys:["flex","主轴","侧轴","justify","align","flex-wrap","flex-flow","子项"], art:"flex", tag:"Flex 布局",

  {keys:["定位","绝对定位","相对定位","固定定位","粘性","z-index","叠放"], art:"pos", tag:"CSS 定位",
   points:["<b>relative</b> 相对自己原位偏移，原位置还占着——最大用途是给子元素当参照。",

           "<b>fixed</b> 相对浏览器窗口，滚动不动（吸顶导航）；<b>sticky</b> 滚到阈值后粘住。",
           "z-index 只在定位元素上生效，数字大的盖住小的。"]},

  {keys:["选择器","后代选择器","子元素选择器","并集","伪类","通配符","focus","hover"], art:"sel", tag:"CSS 选择器",
   points:["<b>.class</b> 选所有同名类，<b>#id</b> 选全页唯一的那个，<b>标签名</b> 选所有同类标签。",
           "<b>A B</b> 是后代（任意层），<b>A &gt; B</b> 是直接子代（只一层）。",
           "<b>:hover</b> / <b>:focus</b> 是状态伪类，鼠标移上、获得焦点时生效。",
           "JS 里的 querySelector 用的就是同一套选择器语法。"]},

  {keys:["优先级","权重","层叠","继承"], art:"weight", tag:"CSS 优先级",
   points:["顺序：<b>!important &gt; 行内 style &gt; #id &gt; .class &gt; 标签</b>。",
           "同优先级时，<b>后写的赢</b>（层叠）。",
           "继承只对文字相关属性有效（color / font / line-height），布局属性不继承。",
           "样式不生效先按 F12，看是不是被更高优先级的规则划掉了。"]},

  {keys:["基本结构标签","DOCTYPE","字符集","语法规范","lang","title"], art:"skeleton", tag:"HTML 骨架",
   points:["<b>&lt;!DOCTYPE html&gt;</b> 声明用 HTML5，不写会进怪异模式。",
           "<b>&lt;meta charset=\"UTF-8\"&gt;</b> 防中文乱码。",
           "<b>&lt;meta name=\"viewport\"&gt;</b> 让手机端按设备宽度渲染，少了它响应式全废。",
           "CSS 放 head，JS 放 body 末尾（否则执行时元素还没生成）。"]},

  {keys:["标题标签","段落","换行","文本格式化","div和span","注释"], art:"tag", tag:"HTML 标签",
   points:["<b>div</b> 块级，独占一行；<b>span</b> 行内，跟着文字排。",
           "h1–h6 是标题层级，一个页面只放一个 h1。",
           "strong / em 有语义（强调），b / i 只是样式，优先用前者。",
           "标签可以嵌套但不能交叉，注释写 &lt;!-- --&gt;。"]},

  {keys:["图像","img","图片"], art:"tag", tag:"图片",
   points:["<b>&lt;img src=\"…\" alt=\"…\"&gt;</b> 是自闭合标签。",
           "alt 是图片加载失败时的替代文字，也是无障碍必须项。",
           "路径写错是最常见的「图片不出来」原因，先用 F12 看 Network。"]},

  {keys:["链接","锚点","a标签"], art:"tag", tag:"超链接",
   points:["<b>&lt;a href=\"…\"&gt;</b> 指向别处，<b>#id</b> 指向本页锚点。",
           "外部链接加 <b>target=\"_blank\"</b> 时建议配 rel=\"noopener\"。",
           "a 里可以包块级元素（HTML5 允许），但别嵌套 a。"]},

  {keys:["列表","无序列表","有序列表","自定义列表"], art:"tag", tag:"列表",
   points:["<b>ul</b> 无序、<b>ol</b> 有序，子元素只能是 <b>li</b>。",
           "导航栏几乎都用 ul + li + a 写，方便屏幕阅读器理解。",
           "list-style: none 去掉默认圆点。"]},

  {keys:["表格","表头","合并单元格","表格结构"], art:"tag", tag:"表格",
   points:["<b>table &gt; thead/tbody &gt; tr &gt; th/td</b> 是标准结构。",
           "<b>colspan</b> 横跨列，<b>rowspan</b> 竖跨行。",
           "border-collapse: collapse 让相邻边框合成一条。"]},

  {keys:["表单","input","label","select","textarea","button","name","value","checked"], art:"tag", tag:"表单",
   points:["<b>input 的 type</b> 决定形态：text / password / email / number / checkbox / radio / file / date。",
           "<b>label 的 for</b> 必须等于 input 的 id，点文字才能聚焦输入框。",
           "<b>radio 要同 name</b> 才互斥；<b>checked</b> 是默认选中。",
           "表单里的 submit 按钮点了会刷新页面，JS 处理时必须 preventDefault。"]},

  {keys:["字体","字号","字重","行高","文本","color","text-align","缩进","装饰"], art:"tag", tag:"文字样式",

           "<b>text-align</b> 管行内内容的水平对齐，不是块本身的居中。",
           "单行文字垂直居中的土办法：line-height 等于容器高度（现在优先用 flex）。",
           "颜色写 #rrggbb 或 rgb()，半透明用 rgba()。"]},

  {keys:["背景"], art:"box", tag:"背景",
   points:["background-color / background-image 可叠加。",
           "<b>background-size: cover</b> 铺满不变形，<b>contain</b> 完整显示。",
           "background-position: center 配合 cover 是最常用的首图写法。"]},

  {keys:["圆角","阴影","过渡","变换","动画","2D","3D","渐变"], art:"box", tag:"装饰与动效",

           "<b>transform</b> 做位移 / 缩放 / 旋转，性能比改 top/left 好。",

  {keys:["浮动"], art:"pos", tag:"浮动（已过时）",

  {keys:["媒体查询","响应式","rem","vw","vh","适配"], art:"flex", tag:"响应式",
   points:["<b>@media (min-width: 768px)</b> 是断点，屏幕够宽时才应用里面的样式。",

           "rem 相对根字号，vw/vh 相对视口，做整体缩放比 px 灵活。",

  {keys:["javascript","变量","数据类型","运算符","类型转换","typeof"], art:"func", tag:"JS 基础",

           "基本类型：string / number / boolean / null / undefined / symbol。",

  {keys:["函数","return","参数","作用域","匿名函数","立即执行","闭包","预解析"], art:"func", tag:"函数",

  {keys:["对象","构造函数","原型","实例","new "], art:"obj", tag:"对象",

  {keys:["数组","遍历","筛选","排序","去重","索引"], art:"array", tag:"数组",

           "方法分两类：返回新数组（map/filter）和改原数组（push/splice/sort）。"]},

  {keys:["map","foreach","filter","reduce","find","every","some","join"], art:"array", tag:"数组方法",

           "<b>reduce</b> 把数组收敛成一个值（求和、计数、分组）。",

  {keys:["dom","获取元素","节点","innerhtml","innertext","classlist","dataset","自定义属性","表单值"], art:"dom", tag:"DOM 操作",

           "改样式优先改类名：<b>classList.add / remove / toggle</b>。",

  {keys:["事件","冒泡","委托","监听","阻止默认","键盘","鼠标","焦点"], art:"event", tag:"事件",

           "表单提交 / 链接跳转的默认行为要用 <b>e.preventDefault()</b> 拦掉。"]},

  {keys:["字符串","正则","替换","截取","拼接"], art:"tag", tag:"字符串",

           "常用方法：slice / split / includes / replace / trim。",
           "字符串不可变，所有方法都返回新字符串。",
           "正则适合做格式校验和批量替换，但别写太复杂。"]},

  {keys:["bom","定时器","location","navigator","history","window"], art:"timeline", tag:"BOM",
   points:["BOM 是浏览器窗口那套 API：window / location / history / navigator。",
           "<b>setTimeout(fn, 1000)</b> 延迟一次，<b>setInterval</b> 周期执行，记得 clear。",
           "<b>location.href</b> 跳转、<b>location.search</b> 取查询参数。",
           "页面加载完再操作 DOM：DOMContentLoaded 或把 script 放 body 末尾。"]},

  {keys:["本地存储","localstorage","sessionstorage","缓存"], art:"storage", tag:"本地存储",
   points:["<b>localStorage</b> 永久保存，关浏览器也在；sessionStorage 关标签页就没。",
           "只能存字符串，<b>对象要 JSON.stringify 存、JSON.parse 读</b>。",
           "容量约 5MB，只适合存轻量配置和列表，不要当数据库用。",
           "读的时候给默认值：<b>JSON.parse(x) || []</b>，否则第一次打开会报错。"]},

  {keys:["promise","async","await","异步","回调"], art:"async", tag:"异步",
   points:["JS 单线程，网络请求不阻塞页面，等结果回来才继续——这就是异步。",
           "<b>async / await</b> 让异步代码看起来像同步，<b>await</b> 后面拿到的是结果本身。",
           "await 只能写在 async 函数里；写在最外层需要模块环境。",
           "请求可能失败，必须 <b>try / catch</b>，否则一个报错整页白掉。"]},

  {keys:["箭头函数","解构","扩展运算符","剩余参数","模板字符串","默认参数","简写"], art:"func", tag:"ES6 语法",
   points:["箭头函数 <b>() =&gt; {}</b> 没有自己的 this 和 arguments。",
           "解构能从数组/对象里一次取出多个值：<b>const { a, b } = obj</b>。",
           "扩展运算符 <b>...</b> 用来复制和合并：<b>{ ...obj }</b> / <b>[...arr]</b>。",
           "参数默认值 <b>function f(a = 1)</b> 比在函数体里判断更清爽。"]},

  {keys:["class","继承","静态成员","getter","setter"], art:"obj", tag:"class 类",
   points:["class 只是构造函数的语法糖，本质还是原型。",
           "<b>constructor</b> 里初始化实例属性，<b>extends</b> 继承父类。",
           "子类用 super() 调父类构造函数，必须先调再用 this。",
           "静态方法挂在类上（Math.max 那种），实例方法挂在原型上。"]},

  {keys:["模块化","import","export","babel","npm"], art:"obj", tag:"模块化",
   points:["<b>export</b> 导出、<b>import</b> 导入，一个文件就是一个模块。",
           "默认导出 <b>export default</b> 只能有一个，命名导出可以多个。",
           "浏览器原生支持 &lt;script type=\"module\"&gt;，工程里由 Vite / webpack 处理。",
           "模块化解决的是「全局变量污染」和「依赖顺序」两个问题。"]},

  {keys:["symbol","迭代器","生成器","set","map","数值扩展","对象扩展"], art:"obj", tag:"ES6 进阶",
   points:["Symbol 是唯一值，常用来做对象的私有键。",

           "Set 自动去重，Map 的键可以是任意类型（对象也行）。",
           "这些在业务里用得少，能看懂即可。"]},

  {keys:["品优购","学成在线","京东","苏宁","携程","黑马面面","项目","案例","实战"], art:"project", tag:"实战项目",

var NOTES = {"A-9":"html 包住 head 与 body：head 放 meta / title / link，body 放可见内容。VSCode 里输入 <b>!</b> 再按 Tab 可直接生成这套骨架。","A-12":"<b>DOCTYPE</b> 声明 HTML5，不写会进怪异模式；<b>charset=UTF-8</b> 防中文乱码；<b>lang</b> 影响朗读与翻译。","A-18":"<b>div</b> 块级独占一行，<b>span</b> 行内跟随文字。布局用 div，包一小段文字用 span。","A-46":"<b>input 的 type</b> 决定形态：text 单行文本、password 显示圆点；placeholder 是提示文字，value 才是真正的值。","A-67":"类选择器 <b>.card</b> 选中所有 class=\"card\" 的元素，一个元素可挂多个类名（class=\"card active\"）。","A-86":"外部样式表用 <b>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;</b>，放 head 里；三种引入方式的优先级看「行内 &gt; 内部/外部，同位置看先后」。","A-92":"F12 打开 Elements 看最终生效的样式，被划掉的就是被覆盖的；先在面板里试改，再写回文件。","A-132":"<b>!important &gt; 行内 &gt; #id &gt; .class &gt; 标签</b>；同权重时后写的赢——这就是层叠。","A-138":"盒模型 = <b>content + padding + border + margin</b>，width 默认只算 content，所以加 padding 会撑大盒子。","A-143":"padding 会撑大盒子；<b>padding: 10px 20px</b> 是上下 10、左右 20。不想被撑大就设 box-sizing: border-box。","A-150":"margin 管盒子之间的间距；左右 auto 让固定宽度块水平居中；相邻上下 margin 会合并取大值。","A-225":"<b>relative</b> 相对自己原位偏移，原位置仍占着——最大用途是给 absolute 子元素当参照。","A-227":"<b>absolute</b> 相对最近的已定位祖先偏移，没有就相对初始包含块；它会脱标、不占位置。","A-231":"<b>fixed</b> 相对浏览器窗口固定，滚动不动，吸顶导航、返回顶部常用。","A-295":"<b>transition: 属性 时长 曲线 延迟</b>；只能过渡有中间值的属性（width / opacity / transform），display 不行。","A-418":"父元素 <b>display: flex</b> 后，直接子元素默认排成一行，成为 flex item。","A-420":"<b>justify-content</b> 管主轴：flex-start / center / space-between / space-around。","A-422":"<b>align-items</b> 管交叉轴（横排时是垂直），center 最常用；多行还要配 align-content。","A-425":"<b>flex: 1</b> = grow 1 + shrink 1 + basis 0%，用来占满剩余空间，是「左固定右自适应」的关键。","A-444":"<b>@media (max-width: 768px){…}</b> 断点内覆盖样式；移动优先则反过来用 min-width 逐级加宽。","B-12":"数组用 <b>[]</b> 声明，下标从 0 开始，<b>length</b> 是长度；取值和改值都靠下标。","B-16":"模板字符串用反引号，<b>${表达式}</b> 直接插值，还能换行，比拼字符串安全。","B-50":"<b>function 名(参数){…}</b>；参数是入口，没传就是 undefined；先声明后调用。","B-53":"<b>return</b> 把结果交出去并立刻结束函数；不写 return 得到 undefined。","B-65":"对象是键值对集合；取值 <b>obj.key</b> 或 obj[\"key\"]，改值直接赋值。","B-80":"DOM 是把 HTML 解析成的一棵树，document 是根，每个标签都是一个节点对象。","B-81":"<b>querySelector</b> 返回第一个匹配，querySelectorAll 返回 NodeList（要遍历或转成数组）。","B-82":"<b>textContent</b> 只改文字，<b>innerHTML</b> 会解析标签；插入用户输入用 textContent 防 XSS。","B-86":"<b>classList.add / remove / toggle / contains</b> 改类名，比直接改 style 更好维护。","B-89":"表单控件的值在 <b>.value</b>，checkbox 用 .checked；不要用 innerHTML 去读。","B-94":"<b>addEventListener(\"click\", fn)</b>；同一元素能绑多个监听，不会互相覆盖。","B-101":"事件对象 e：<b>e.target</b> 是真正触发的元素，e.currentTarget 是绑定监听的元素。","B-110":"<b>e.preventDefault()</b> 阻止默认行为（表单提交刷新、a 跳转）；stopPropagation 才是不让冒泡。","B-131":"<b>localStorage</b> 只能存字符串；对象要 JSON.stringify 存、JSON.parse 读，读的时候给默认值防报错。","B-134":"<b>map</b> 返回新数组、<b>join(\"\")</b> 拼成字符串——把数据渲染成 HTML 的标准组合。","B-158":"箭头函数 <b>() =&gt; {}</b> 没有自己的 this，会继承外层；单表达式可以省略 return。","B-192":"<b>try{…}catch(e){…}</b> 兜住可能失败的代码，throw 主动抛错，finally 一定执行。","C-24":"Promise 三种状态 pending / fulfilled / rejected；<b>then</b> 接成功，<b>catch</b> 接失败。","C-49":"<b>async</b> 函数一定返回 Promise；<b>await</b> 等结果，失败要用 try / catch 接。"};

var COLOR = {A:"#2563eb",B:"#0f7a5a",C:"#b45309"};
var TOTAL = 0;
var CHAP = {}, EP = {};
DATA.forEach(function (co) {
  co.chapters.forEach(function (ch, ci) {
    var cid = co.id + "-ch" + ci;
    ch.cid = cid; ch.ci = ci; ch.co = co;
    CHAP[cid] = ch;
    ch.eps.forEach(function (e) {
      TOTAL++;
      EP[co.id + "-" + e.p] = { co: co, ch: ch, e: e, key: co.id + "-" + e.p };
    });
  });
});

var doneSet = new Set();
(function () {
  var sv = null;
  try { sv = JSON.parse(localStorage.getItem("mm-web-done")); } catch (e) {}
  DATA.forEach(function (co) { co.chapters.forEach(function (ch) { ch.eps.forEach(function (e) {
    if (sv ? sv.indexOf(co.id + "-" + e.p) >= 0 : e.d) doneSet.add(co.id + "-" + e.p);
  }); }); });
})();

var filter = "all", kw = "", view = "chain", scale = 1;
var panX = 0, panY = 0, fitScale = 1;
var pop = document.getElementById("pop"), anchorRect = null, curKey = null;

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function save() { try { localStorage.setItem("mm-web-done", JSON.stringify(Array.from(doneSet))); } catch (e) {} }

function epOK(e, key) {
  var on = doneSet.has(key);
  if (filter === "done" && !on) return false;
  if (filter === "todo" && on) return false;
  if (kw && (e.t.toLowerCase().indexOf(kw) < 0 && key.toLowerCase().indexOf(kw) < 0)) return false;
  return true;
}
function chapOK(ch) {
  if (!kw) return ch.eps.some(function (e) { return epOK(e, ch.co.id + "-" + e.p); });
  if (ch.name.toLowerCase().indexOf(kw) >= 0) return ch.eps.some(function (e) {
    var on = doneSet.has(ch.co.id + "-" + e.p);
    return (filter === "all") || (filter === "done" ? on : !on);
  });
  return ch.eps.some(function (e) { return epOK(e, ch.co.id + "-" + e.p); });
}
function chapDone(ch) {
  var d = 0;
  ch.eps.forEach(function (e) { if (doneSet.has(ch.co.id + "-" + e.p)) d++; });
  return d;
}

function refresh() {
  var n = doneSet.size;
  document.getElementById("nDone").textContent = n;
  document.getElementById("nTodo").textContent = TOTAL - n;
}

/* ================= 长链路 ================= */
function renderChain() {
  var wrap = document.getElementById("chainView");
  var h = "";
  DATA.forEach(function (co) {
    var chs = co.chapters.filter(chapOK);
    if (!chs.length) return;
    var dn = 0, cnt = 0;
    chs.forEach(function (ch) { cn(ch); });
    function cn(ch) { ch.eps.forEach(function (e) { cnt++; if (doneSet.has(co.id + "-" + e.p)) dn++; }); }
    h += '<section class="lane c' + co.id + '">' +
         '<div class="lane-head"><b>' + esc(co.name) + '</b><span class="cnt">' + dn + " / " + cnt + ' 集</span></div>' +
         '<div class="lane-cards">';
    chs.forEach(function (ch) {
      var cd = chapDone(ch);
      h += '<div class="card c' + co.id + '" data-cid="' + ch.cid + '">' +
           '<div class="chead" data-toggle="' + ch.cid + '"><span class="no">' + String(ch.ci + 1).padStart(2,"0") + '</span>' +
           '<span class="nm" title="' + esc(ch.name) + '">' + esc(ch.name) + '</span>' +
           '<span class="cnt">' + cd + "/" + ch.eps.length + '</span></div><ul class="clist">';
      ch.eps.forEach(function (e) {
        var k = co.id + "-" + e.p;
        if (!epOK(e, k)) return;
        var on = doneSet.has(k);
        h += '<li class="ci' + (on ? " done" : "") + '" data-k="' + k + '" title="' + esc(e.t) + '">' +
             '<span class="pn">P' + e.p + '</span><span class="t">' + esc(e.t) + '</span>' +
             '<button class="q" data-k="' + k + '" title="看这一集的详解">?</button></li>';
      });
      h += '</ul></div>';
    });
    h += '</div></section>';
  });
  wrap.innerHTML = h || '<div class="empty">没有匹配的知识点</div>';
  wrap.scrollTop = 0;
}

document.getElementById("chainView").addEventListener("click", function (e) {
  var q = e.target.closest(".q");
  if (q) { openEpisode(q.getAttribute("data-k"), q); return; }
  var tg = e.target.closest("[data-toggle]");
  if (tg) { tg.parentNode.classList.toggle("closed"); return; }
  var ci = e.target.closest(".ci");
  if (ci) { openEpisode(ci.getAttribute("data-k"), ci); }
});

/* ================= 思维导图 ================= */
var CX = 700, CY = 620, GAP = 27, LEAFW = 216, LEAFH = 24;
var CENX = CX, CENY = CY, BND = { x0: CX - 660, x1: CX + 660, y0: CY - 320, y1: CY + 320 };

function mapVisible() {
  var out = [];
  DATA.forEach(function (co) {
    var chs = co.chapters.filter(chapOK);
    if (chs.length) out.push({ co: co, chs: chs });
  });
  return out;
}

function layout() {
  var groups = mapVisible();
  var left = groups.filter(function (g) { return g.co.id === "A"; });
  var right = groups.filter(function (g) { return g.co.id !== "A"; });
  function stack(list) {
    var total = 0;
    list.forEach(function (g, i) { total += g.chs.length * GAP + (i ? 54 : 0); });
    var y = CY - total / 2;
    list.forEach(function (g, i) {
      if (i) y += 54;
      g.chs.forEach(function (ch, j) { ch._y = y + j * GAP + GAP / 2; });
      g.courseY = (g.chs[0]._y + g.chs[g.chs.length - 1]._y) / 2;
      g.top = y;
      y += g.chs.length * GAP;
    });
  }
  stack(left); stack(right);
  var ys = [];
  left.concat(right).forEach(function (g) {
    g.chs.forEach(function (ch) { ys.push(ch._y); });
  });
  var y0 = Math.min.apply(null, ys) - LEAFH, y1 = Math.max.apply(null, ys) + LEAFH;
  BND = { x0: CX - 660, x1: CX + 656, y0: y0, y1: y1 };
  CENX = (BND.x0 + BND.x1) / 2; CENY = (BND.y0 + BND.y1) / 2;
  return { left: left, right: right };
}

function bez(x1, y1, x2, y2) {
  var mx = (x1 + x2) / 2;
  return '<path d="M' + x1 + ' ' + y1 + 'C' + mx + ' ' + y1 + ',' + mx + ' ' + y2 + ',' + x2 + ' ' + y2 +
         '" fill="none" stroke-width="1.2" opacity=".55"/>';
}

function courseCnt(co) {
  var d = 0, n = 0;
  co.chapters.forEach(function (ch) { ch.eps.forEach(function (e) { n++; if (doneSet.has(co.id + "-" + e.p)) d++; }); });
  return d + " / " + n;
}

function renderMap() {
  var g = layout(), nodes = "", edges = "";
  nodes += '<div class="node root" style="left:' + (CX - 80) + 'px;top:' + (CY - 30) + 'px;width:160px;height:60px">' +
           '<span>前端知识</span><small>' + TOTAL + ' 集 · ' + Object.keys(CHAP).length + ' 章</small></div>';

  function branch(list, side) {
    list.forEach(function (grp) {
      var co = grp.co, col = COLOR[co.id];
      var cx = side === "left" ? CX - 330 : CX + 180;
      var leafX = side === "left" ? CX - 650 : CX + 440;
      nodes += '<div class="node course c' + co.id + '" style="left:' + cx + 'px;top:' + (grp.courseY - 18) +
               'px;width:168px;height:36px">' + esc(co.name) + '<small class="cc">' + courseCnt(co) + '</small></div>';
      var x1 = side === "left" ? CX - 80 : CX + 80;
      var x2 = side === "left" ? cx + 168 : cx;
      edges += bez(x1, CY, x2, grp.courseY).replace('stroke-width="1.2"', 'stroke="' + col + '" stroke-width="1.4"');
      grp.chs.forEach(function (ch) {
        var d = chapDone(ch), on = d > 0;
        nodes += '<div class="node leaf c' + co.id + '" data-cid="' + ch.cid + '" style="left:' + leafX +
                 'px;top:' + (ch._y - LEAFH / 2) + 'px;width:' + LEAFW + 'px;height:' + LEAFH + 'px" title="' + esc(ch.name) + '">' +
                 '<span class="nm">' + esc(ch.name) + '</span>' +
                 '<span class="cnt">' + (on ? '<b>' + d + '</b>/' : '') + ch.eps.length + '</span>' +
                 '<button class="q" data-cid="' + ch.cid + '" title="看这一章">?</button></div>';
        edges += bez(side === "left" ? cx : cx + 168, grp.courseY,
                     side === "left" ? leafX + LEAFW : leafX, ch._y).replace('stroke-width="1.2"', 'stroke="' + col + '"');
      });
    });
  }
  branch(g.left, "left"); branch(g.right, "right");
  document.getElementById("nodes").innerHTML = nodes;
  var svg = document.getElementById("edges");
  svg.innerHTML = edges;
  svg.setAttribute("width", 1400); svg.setAttribute("height", 1240);
  applyTransform();
}

function applyTransform() {
  var st = document.getElementById("stage");
  var tx = st.clientWidth / 2 - CENX * scale + panX;
  var ty = st.clientHeight / 2 - CENY * scale + panY;
  document.getElementById("world").style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
  document.getElementById("zv").textContent = Math.round(scale * 100) + "%";
}

function fit() {
  if (view !== "map") return;
  var st = document.getElementById("stage");
  var w = BND.x1 - BND.x0, h = BND.y1 - BND.y0;
  scale = Math.min(1.25, Math.min((st.clientWidth - 48) / w, (st.clientHeight - 44) / h));
  panX = 0; panY = 0; applyTransform();
}

document.getElementById("mapView").addEventListener("click", function (e) {
  if (e.target.closest("#world")) {
    var leaf = e.target.closest(".leaf");
    if (leaf) { openChapter(leaf.getAttribute("data-cid"), leaf); }
  }
});

/* 拖拽 / 缩放 */
(function () {
  var st = document.getElementById("stage"), down = false, sx = 0, sy = 0, px = 0, py = 0, moved = false;
  st.addEventListener("mousedown", function (e) {
    if (view !== "map" || e.target.closest(".node")) return;
    down = true; moved = false; sx = e.clientX; sy = e.clientY; px = panX; py = panY;
    st.classList.add("drag");
  });
  window.addEventListener("mousemove", function (e) {
    if (!down) return;
    panX = px + (e.clientX - sx); panY = py + (e.clientY - sy);
    if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 3) moved = true;
    applyTransform();
  });
  window.addEventListener("mouseup", function () { down = false; st.classList.remove("drag"); });
  st.addEventListener("wheel", function (e) {
    if (view !== "map") return;
    e.preventDefault();
    var r = st.getBoundingClientRect();
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    var wx = (mx - (st.clientWidth / 2 - CENX * scale + panX)) / scale;
    var wy = (my - (st.clientHeight / 2 - CENY * scale + panY)) / scale;
    var ns = Math.min(2, Math.max(0.25, scale * (e.deltaY < 0 ? 1.1 : 0.9)));
    scale = ns;
    panX = mx - (st.clientWidth / 2 - CENX * scale) - wx * scale;
    panY = my - (st.clientHeight / 2 - CENY * scale) - wy * scale;
    applyTransform();
  }, { passive: false });
})();

/* ================= 详情卡 ================= */
function place(el) {
  var r = el.getBoundingClientRect();
  var w = Math.min(376, window.innerWidth - 24);
  pop.style.width = w + "px";
  var h = pop.offsetHeight;
  var left = r.right + 14;
  if (left + w > window.innerWidth - 10) left = r.left - w - 14;
  if (left < 10) left = Math.max(10, window.innerWidth - w - 10);
  var top = r.top + r.height / 2 - h / 2;
  top = Math.max(56, Math.min(top, window.innerHeight - h - 12));
  pop.style.left = left + "px"; pop.style.top = top + "px";
}

function shell(html, el) {
  pop.innerHTML = html + '';
  pop.classList.add("on");
  if (el) { anchorRect = el.getBoundingClientRect(); place(el); }
  else if (anchorRect) place({ getBoundingClientRect: function () { return anchorRect; } });
}

function closePop() { pop.classList.remove("on"); pop.innerHTML = ""; curKey = null; }

function openEpisode(k, el) {
  var d = EP[k]; if (!d) return;
  curKey = k;
  var info = infoFor(d.e.t), on = doneSet.has(k);
  var pts = info.points.map(function (x) { return "<li>" + x + "</li>"; }).join("");
  var min = Math.round(d.e.s / 60);
  var sum = d.ch.sum ? '<div class="psum"><b>本章定位</b>' + esc(d.ch.sum) + "</div>" : "";
  var note = NOTES[k] ? '<div class="pnote"><b class="lab">你学过这一集</b>' + NOTES[k] + "</div>" : "";
  shell(
    '<div class="ph"><span class="pk">P' + d.e.p + '</span><span class="pc c' + d.co.id + '">' + esc(d.co.name) + '</span>' +
      '<span class="pch">' + esc(d.ch.name) + '</span><button class="px" id="px">×</button></div>' +
    '<div class="pt">' + esc(d.e.t) + '</div>' +
    '<div class="pm"><span>' + min + ' 分钟</span><i>·</i><span>第 ' + (d.ch.ci + 1) + ' 章 · ' + (d.ch.eps.indexOf(d.e) + 1) + '/' + d.ch.eps.length + ' 集</span><i>·</i>' +
      '<span class="' + (on ? "on" : "") + '">' + (on ? "已学" : "待学") + '</span></div>' +
    '<div class="pbody">' + sum + note +
      '<div class="art">' + artFor(d.e.t, info.art) + '<div class="cap">' + esc(info.tag) + ' · 示意图</div></div>' +
      '<div class="ph2">这个知识点在讲什么</div><ul class="plist">' + pts + "</ul></div>" +
    '<div class="pfoot"><button class="pmark' + (on ? " on" : "") + '" id="pmark">' + (on ? "已标记" : "标记已学") + "</button>" +
      '<a class="pgo" href="https://www.bilibili.com/video/' + d.co.bv + "?p=" + d.e.p + '" target="_blank" rel="noopener">在 B 站看这一集 ↗</a></div>',
    el
  );
}

function openChapter(cid, el) {
  var ch = CHAP[cid]; if (!ch) return;
  curKey = null;
  var co = ch.co, d = chapDone(ch), n = ch.eps.length;
  var rows = ch.eps.map(function (e) {
    var k = co.id + "-" + e.p, on = doneSet.has(k);
    return '<div class="erow' + (on ? " done" : "") + '" data-k="' + k + '">' +
      '<span class="pn">P' + e.p + '</span><span class="t">' + esc(e.t) + '</span>' +
      '<a class="go" href="https://www.bilibili.com/video/' + co.bv + '?p=' + e.p + '" target="_blank" rel="noopener" title="在 B 站看">↗</a></div>';
  }).join("");
  shell(
    '<div class="ph"><span class="pc c' + co.id + '">' + esc(co.name) + '</span><span class="pch">第 ' + (ch.ci + 1) + ' 章 / 共 ' + co.chapters.length + ' 章</span><button class="px" id="px">×</button></div>' +
    '<div class="pt">' + esc(ch.name) + '</div>' +
    '<div class="pm"><span>已学 <b>' + d + '</b> / ' + n + ' 集</span><i>·</i><span>' + (n ? Math.round(d / n * 100) : 0) + '%</span></div>' +
    '<div class="pbody"><div class="psum"><b>本章定位</b>' + esc(ch.sum || "") + '</div>' +
      '<div class="ph2">本章分集</div><div class="eps">' + rows + "</div></div>",
    el
  );
}

pop.addEventListener("click", function (e) {
  if (e.target.id === "px") { closePop(); return; }
  var mk = e.target.closest("#pmark");
  if (mk && curKey) {
    if (doneSet.has(curKey)) doneSet.delete(curKey); else doneSet.add(curKey);
    save(); refresh(); render();
    var fake = { getBoundingClientRect: function () { return anchorRect; } };
    openEpisode(curKey, fake);
    return;
  }
  var go = e.target.closest("a.go");
  if (go) return;
  var row = e.target.closest(".erow");
  if (row) { openEpisode(row.getAttribute("data-k"), { getBoundingClientRect: function () { return anchorRect; } }); }
});

document.addEventListener("click", function (e) {
  if (!pop.classList.contains("on")) return;
  if (e.target.closest("#pop")) return;
  if (e.target.closest(".node") || e.target.closest(".ci") || e.target.closest(".q") || e.target.closest("[data-toggle]")) return;
  closePop();
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePop(); });

/* ================= 视图 / 过滤 / 搜索 ================= */
function render() {
  refresh();
  if (view === "chain") { renderChain(); }
  else { renderMap(); }
  document.getElementById("hint").textContent = view === "chain"
    ? "点章节看细节 · 点 ? 看单集 · 点章节标题可收起"
    : "点章节看细节 · 滚轮缩放 · 拖拽平移 · 适应窗口看全景";
}

function applyView() {
  var isMap = view === "map";
  document.getElementById("chainView").style.display = isMap ? "none" : "";
  document.getElementById("mapView").classList.toggle("on", isMap);
  document.getElementById("zoomWrap").style.display = isMap ? "inline-flex" : "none";
  document.getElementById("switch").textContent = isMap ? "→ 切到全链路图" : "→ 切到思维导图";
  if (isMap) { renderMap(); fit(); }
  document.getElementById("hint").textContent = isMap
    ? "点章节看细节 · 滚轮缩放 · 拖拽平移 · 适应窗口看全景"
    : "点章节看细节 · 点 ? 看单集 · 点章节标题可收起";
}

document.getElementById("switch").onclick = function () {
  view = view === "chain" ? "map" : "chain";
  closePop(); applyView(); render();
};
document.getElementById("zi").onclick = function () { scale = Math.min(2, scale * 1.15); applyTransform(); };
document.getElementById("zo").onclick = function () { scale = Math.max(0.25, scale / 1.15); applyTransform(); };
document.getElementById("fit").onclick = fit;
document.getElementById("expand").onclick = function () {
  document.querySelectorAll(".card.closed").forEach(function (c) { c.classList.remove("closed"); });
};
document.getElementById("fold").onclick = function () {
  document.querySelectorAll(".card").forEach(function (c) { c.classList.add("closed"); });
};
document.getElementById("seg").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  filter = b.getAttribute("data-f");
  document.querySelectorAll("#seg button").forEach(function (x) { x.classList.toggle("on", x === b); });
  closePop(); render();
});
document.getElementById("q").addEventListener("input", function (e) {
  kw = e.target.value.trim().toLowerCase();
  closePop(); render();
});

document.getElementById("exp").onclick = function () {
  var blob = new Blob([JSON.stringify({ v: 1, done: Array.from(doneSet) }, null, 1)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "frontend-done.json";
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
};
document.getElementById("imp").onclick = function () { document.getElementById("file").click(); };
document.getElementById("file").onchange = function (e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var arr = JSON.parse(r.result);
      var list = Array.isArray(arr) ? arr : (arr.done || []);
      doneSet = new Set(list.filter(function (k) { return EP[k]; }));
      save(); refresh(); render();
    } catch (err) { alert("文件格式不对，需要导出标记生成的 JSON"); }
  };
  r.readAsText(f);
  e.target.value = "";
};
document.getElementById("clr").onclick = function () {
  if (!confirm("清空所有标记？")) return;
  doneSet = new Set(); save(); refresh(); render();
};

window.addEventListener("resize", function () { if (view === "map") fit(); });

/* 初始化 */
(function () {
  var f = (location.search.match(/[?&]f=(all|done|todo)/) || [])[1];
  if (f) {
    filter = f;
    document.querySelectorAll("#seg button").forEach(function (x) { x.classList.toggle("on", x.getAttribute("data-f") === f); });
  }
  var v = (location.search.match(/[?&]view=(map|chain)/) || [])[1];
  if (v) view = v;
  applyView();
  render();
  var op = (location.search.match(/[?&]open=([A-C]-\d+)/) || [])[1];
  if (op && EP[op]) {
    view = "map"; applyView(); render();
    var node = document.querySelector('.leaf[data-cid="' + EP[op].ch.cid + '"]');
    setTimeout(function () { openEpisode(op, node || document.querySelector(".node.root")); }, 60);
  }
})();
</script>
</body>
</html>
